/* Layout: barra de estado fija; título → mapa ilustrado del templo + panel de cámara + modos; juego = escena | pergamino de pregunta */
:root{
  color-scheme: dark;
  --night:#15121c; --stone:#1e1a27; --stone-2:#28232f; --stone-3:#373042; --line:#4a4157;
  --sand:#f0e6cf; --sand-2:#c3b89f; --sand-3:#8d8374;
  --torch:#f2a541; --torch-hi:#ffd27f; --torch-lo:rgba(242,165,65,.15);
  --lapis:#4cbccb; --lapis-hi:#8fe3ec; --lapis-lo:rgba(76,188,203,.16);
  --ember:#e66a50; --ember-hi:#ff9c86; --ember-lo:rgba(230,106,80,.16);
  --moss:#9cc472; --moss-lo:rgba(156,196,114,.18);
  --ink:#2a1a05; --scrim:rgba(9,7,13,.76); --grid-c:rgba(240,230,207,.035); --shadow:rgba(0,0,0,.45);
  --av-skin:#d9a57a; --av-hat:#8a6a45; --av-pack:#6b4f36; --av-leg:#3a3140;
  --f-display:'Marcellus SC','Marcellus',Georgia,'Times New Roman',serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',Verdana,system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--night);color:var(--sand);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(900px 520px at 6% -12%,rgba(242,165,65,.11),transparent 62%),radial-gradient(760px 480px at 102% 0%,rgba(76,188,203,.07),transparent 60%);background-attachment:fixed}
#amb{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(28px,4.2vw,46px);line-height:1.08}
h2{font-size:clamp(22px,2.6vw,28px);line-height:1.15}
h3{font-size:20px;line-height:1.2}
p{margin:0}
.eyebrow{font:700 12px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--torch);margin:0}
.lead{color:var(--sand-2);font-size:18px;max-width:62ch}
.small{font-size:14px;color:var(--sand-2)}
kbd{font:600 12px/1 var(--f-mono);padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--night);color:var(--sand-2)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px/1.2 var(--f-body);padding:11px 18px;border-radius:9px;border:1px solid var(--line);background:var(--stone-3);color:var(--sand);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--sand-3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--torch);border-color:var(--torch);color:var(--ink)}
.btn.primary:hover:not(:disabled){background:var(--torch-hi);border-color:var(--torch-hi)}
.btn.ghost{background:transparent}
.btn.tiny{padding:7px 12px;font-size:14px}
.btn.big{padding:15px 26px;font-size:17px}
.btn.danger{border-color:var(--ember);color:var(--ember-hi);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--torch-hi);outline-offset:2px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:14px;background:var(--night);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--sand);font-family:var(--f-display);font-size:20px;cursor:pointer;padding:0}
.brand b{color:var(--torch);font-weight:400}
.logo{width:34px;height:34px}
.rank{flex:1 1 240px;min-width:0;display:grid;gap:6px}
.rank-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rank-name{font-family:var(--f-display);color:var(--torch-hi);font-size:17px}
.xpnum{color:var(--sand-2);font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.xpbar{height:8px;border-radius:99px;background:var(--stone-3);overflow:hidden;transition:box-shadow .3s}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--torch),var(--torch-hi));border-radius:inherit;transition:width .7s ease}
.xpbar.pulse-bar{box-shadow:0 0 0 3px var(--torch-lo),0 0 16px rgba(242,165,65,.6)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:var(--stone-2);border:1px solid var(--line);color:var(--sand);font:700 14px var(--f-body)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--sand-3)}
.chip .ico{color:var(--torch)}
.chip-l{color:var(--sand-3);font-weight:400}
@media (max-width:820px){.chip-l{display:none}}

/* Título */
.title{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:36px 10px}
@media (max-width:860px){.title{grid-template-columns:1fr}}
.title-art svg{width:100%;height:auto;display:block}
.title-txt{display:grid;gap:16px}
.title-h{font-size:clamp(38px,6vw,72px);line-height:.98}
.title-h span{color:var(--torch-hi)}
.temple .t-step,.temple .t-col,.temple .t-arch{fill:var(--stone-3);stroke:var(--line);stroke-width:1.5}
.temple .t-roof{fill:var(--stone-2);stroke:var(--torch);stroke-width:2.5;stroke-linejoin:round}
.temple .t-ra{fill:none;stroke:var(--torch-hi);stroke-width:2}
.temple .t-hill{fill:var(--stone)}
.temple .t-door{fill:var(--night);stroke:var(--line);stroke-width:1.5}
.temple .t-glow{animation:glow 3s ease-in-out infinite}
.temple .t-pole{fill:var(--av-pack)}
.temple .t-star{fill:var(--sand);animation:twinkle 3s ease-in-out infinite}
.temple .t-rune{fill:none;stroke:var(--torch-hi);stroke-width:1.5;opacity:.8}
.flame{fill:var(--torch);transform-box:fill-box;transform-origin:50% 100%;animation:flicker .9s ease-in-out infinite alternate}
.flame.f2{animation-duration:1.15s;fill:var(--torch-hi)}

/* Avatar */
.av-sh{fill:rgba(0,0,0,.35)}
.av-leg{stroke:var(--av-leg);stroke-width:3.4;stroke-linecap:round}
.av-pack{fill:var(--av-pack)}
.av-body{fill:var(--lapis)}
.av-scarf{fill:var(--torch)}
.av-head{fill:var(--av-skin)}
.av-hat{fill:var(--av-hat)}
.av-brim{stroke:var(--av-hat);stroke-width:2.6;stroke-linecap:round}
.av.bob{animation:bob 1.8s ease-in-out infinite}
.av.walk{animation:bob .32s ease-in-out infinite}

/* Mapa */
.map{display:grid;gap:28px;padding-block:24px 0}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.mapwrap{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:960px){.mapwrap{grid-template-columns:1fr}}
.tmap{width:100%;height:auto;display:block;border-radius:16px;border:1px solid var(--line);background:var(--stone)}
.m-tile{fill:none;stroke:rgba(240,230,207,.05);stroke-width:1}
.m-wall{fill:none;stroke:var(--line);stroke-width:46;stroke-linecap:round}
.m-cor{fill:none;stroke:var(--stone-2);stroke-width:38;stroke-linecap:round}
.m-line{fill:none;stroke:var(--sand-3);stroke-width:2.5;stroke-dasharray:3 9;stroke-linecap:round;opacity:.6}
.m-line.lit{stroke:var(--torch);opacity:1;stroke-dasharray:10 8;animation:flow 1.6s linear infinite}
.m-mark{fill:none;stroke:rgba(240,230,207,.08);stroke-width:2}
.m-deco{fill:var(--stone-3);stroke:var(--line);stroke-width:1.5}
.m-water{fill:var(--lapis-lo);stroke:var(--lapis);stroke-width:1.2;opacity:.8}
.m-text{font:400 15px var(--f-display);fill:var(--sand-3);letter-spacing:.08em}
.node [data-act]{cursor:pointer;outline:none}
.n-halo{fill:none;stroke:var(--torch);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.node.cur .n-halo{animation:halo 2s ease-out infinite}
.n-disc{fill:var(--stone-3);stroke:var(--line);stroke-width:3;transition:stroke .2s}
.node.done .n-disc{stroke:var(--torch)}
.node.sel .n-disc{stroke:var(--torch-hi);stroke-width:5}
.node [data-act]:hover .n-disc,.node [data-act]:focus-visible .n-disc{stroke:var(--torch-hi)}
.n-emb{fill:none;stroke:var(--sand);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.node.done .n-emb{stroke:var(--torch-hi)}
.n-num{font:400 15px var(--f-display);fill:var(--torch);text-anchor:middle}
.n-name{font:400 16px var(--f-display);fill:var(--sand);text-anchor:middle;paint-order:stroke;stroke:var(--stone);stroke-width:5px}
.n-star{fill:var(--stone-3);stroke:var(--sand-3);stroke-width:1.2}
.n-star.on{fill:var(--torch);stroke:var(--torch-hi)}
.node.locked .n-disc{fill:var(--stone-2)}
.node.locked .n-emb,.node.locked .n-num{opacity:.35}
.node.locked .n-name{fill:var(--sand-3)}
.n-lock rect{fill:var(--stone-2);stroke:var(--sand-3);stroke-width:1.5}
.n-lock path{fill:none;stroke:var(--sand-3);stroke-width:2}
.mpanel{display:grid;gap:12px;align-content:start;padding:22px;border-radius:16px;background:linear-gradient(160deg,var(--stone-2),var(--stone));border:1px solid var(--line)}
.mpanel .btn{justify-self:start}
.mp-emb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--stone-3);border:2px solid var(--torch)}
.mp-emb svg{width:36px;height:36px;fill:none;stroke:var(--torch-hi);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ch-stars{display:flex;gap:4px}
.st{width:20px;height:20px;fill:var(--stone-3);stroke:var(--sand-3);stroke-width:1.2}
.st.on{fill:var(--torch);stroke:var(--torch-hi)}
.sec{display:flex;align-items:baseline;gap:14px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:start;text-align:left;padding:18px;border-radius:14px;background:linear-gradient(160deg,var(--stone-2),var(--stone));border:1px solid var(--line);color:var(--sand);font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.mode:hover:not(:disabled){transform:translateY(-2px);border-color:var(--lapis)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.mode .mi{grid-row:span 2;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--lapis-lo);border:1px solid var(--lapis)}
.mode .mi svg{width:28px;height:28px;color:var(--lapis-hi)}
.mode b{font-family:var(--f-display);font-weight:400;font-size:20px}
.mode span{color:var(--sand-2);font-size:15px}

/* Juego */
.playbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:20px 16px}
.pb-emb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--stone-3);border:2px solid var(--torch);flex:none}
.pb-emb svg{width:28px;height:28px;fill:none;stroke:var(--torch-hi);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pb-title{flex:1 1 220px;min-width:0;display:grid;gap:4px}
.pb-status{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.stage>.full{grid-column:1/-1}
.stage.enter>*{animation:rise .35s ease both}
.stage.enter>*:nth-child(2){animation-delay:.06s}
.figcard{position:relative;background-color:var(--stone);background-image:linear-gradient(var(--grid-c) 1px,transparent 1px),linear-gradient(90deg,var(--grid-c) 1px,transparent 1px);background-size:24px 24px;border:1px solid var(--line);border-radius:14px;padding:14px;min-height:300px;display:grid;place-items:center;min-width:0;overflow:hidden}
.scene-c2 .figcard{background-color:#191626}
.scene-c3 .figcard{background-color:#131a22}
.scene-c5 .figcard{background-color:#1d1812}
.scene-c6 .figcard{background-color:#1f1416}
.fig{width:100%;height:auto;max-width:540px;display:block}
.qcard{background:var(--stone-2);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px;min-width:0;color:var(--sand)}
.qcard.parch{--sand:#2b2116;--sand-2:#5b4a35;--sand-3:#8b765a;--stone:#e6d6b3;--stone-2:#f1e5c9;--stone-3:#dccaa2;--line:#b9a178;--night:#fbf4e2;--torch:#c46e0a;--torch-hi:#8f4a00;--torch-lo:rgba(196,110,10,.16);--lapis:#1b8796;--lapis-hi:#0b6370;--lapis-lo:rgba(20,130,145,.14);--ember:#c4482e;--ember-hi:#a3301a;--ember-lo:rgba(200,70,40,.13);--moss:#4f7d2c;
  background:radial-gradient(120% 90% at 50% 0%,#f6ecd4,#e6d3aa);border-color:#b9a178;box-shadow:inset 0 0 50px rgba(120,80,30,.28),0 10px 30px var(--shadow)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prompt{font-size:19px;line-height:1.65;max-width:62ch}
.prompt b{color:var(--torch-hi)}
.prompt ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:6px}
.stones li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:8px 12px;border-radius:8px;background:var(--stone);border:1px solid var(--line);font-family:var(--f-mono);font-size:17px}
.stones li b{font-family:var(--f-display);color:var(--torch)}
.rune{font-family:var(--f-body);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--lapis-hi)}
.k-a{color:var(--lapis-hi);font-weight:700}.k-b{color:var(--torch-hi);font-weight:700}.k-c{color:var(--moss);font-weight:700}
.m-in{font-family:var(--f-mono);color:var(--torch-hi)}
.ansrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ansrow input{width:190px;max-width:100%;font:600 26px var(--f-mono);padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--night);color:var(--sand)}
.ansrow input:focus{outline:none;border-color:var(--torch)}
.ansrow input:disabled{opacity:.6}
.shake{animation:shake .4s}
.unit{font:600 18px var(--f-mono);color:var(--sand-2)}
.choices{display:grid;gap:10px}
.choice{justify-content:flex-start;text-align:left;font-size:17px;padding:14px 16px;font-weight:400}
.choice.right{border-color:var(--lapis);background:var(--lapis-lo);opacity:1}
.choice.wrong{border-color:var(--ember);background:var(--ember-lo);opacity:1}
.choice.picked{border-color:var(--torch);background:var(--torch-lo);opacity:1}
.qtools{display:flex;flex-wrap:wrap;gap:8px}
.hintbox{border:1px dashed var(--torch);border-radius:10px;padding:12px 14px;background:var(--torch-lo);font-size:16px}
.fb{border-radius:12px;padding:16px 18px;display:grid;gap:10px;animation:rise .25s ease}
.fb.ok{background:var(--lapis-lo);border:1px solid var(--lapis)}
.fb.bad{background:var(--ember-lo);border:1px solid var(--ember)}
.fb.neutral{background:var(--stone);border:1px solid var(--line)}
.fb-title{font-family:var(--f-display);font-size:22px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.fb.ok .fb-title{color:var(--lapis-hi)}.fb.bad .fb-title{color:var(--ember-hi)}
.fb .btn{justify-self:start}
.xpgain{font:700 15px var(--f-mono);color:var(--torch-hi)}
.tag{font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--torch-lo);color:var(--torch-hi)}
.m{display:block;font-family:var(--f-mono);font-size:16px}
.fb-body{display:grid;gap:4px}
.fb-body>*{animation:rise .35s ease both}
.fb-body>*:nth-child(2){animation-delay:.25s}.fb-body>*:nth-child(3){animation-delay:.5s}.fb-body>*:nth-child(4){animation-delay:.75s}.fb-body>*:nth-child(5){animation-delay:1s}.fb-body>*:nth-child(6){animation-delay:1.25s}
.fb-sub{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sand-2);font-weight:700}
.rushed{font-size:15px;color:var(--torch-hi)}

/* Datos marcables */
.dchip{display:inline-flex;align-items:baseline;gap:6px;margin:0 2px;padding:0 8px 1px;border-radius:7px;border:1.5px dashed var(--sand-3);background:var(--stone-3);color:var(--sand);font:inherit;line-height:1.55;cursor:pointer;vertical-align:baseline}
span.dchip{cursor:default}
.dchip .dv{font-family:var(--f-mono);font-weight:700}
.dchip .dr{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--sand-3);font-weight:700}
.dchip.r-cateto{border-style:solid;border-color:var(--lapis);background:var(--lapis-lo)}.dchip.r-cateto .dr{color:var(--lapis-hi)}
.dchip.r-hipotenusa{border-style:solid;border-color:var(--torch);background:var(--torch-lo)}.dchip.r-hipotenusa .dr{color:var(--torch-hi)}
.dchip.r-nosirve{border-style:solid;border-color:var(--line);opacity:.7}.dchip.r-nosirve .dv{text-decoration:line-through}
.dchip.wrong{border-color:var(--ember)!important;box-shadow:0 0 0 2px var(--ember-lo)}
.dv-plain{font-family:var(--f-mono);color:var(--torch-hi)}
.markbox{display:grid;gap:12px;padding:16px;border-radius:12px;background:var(--stone);border:1px solid var(--line)}
.mk-title{font-weight:700}
.mk-title small{font-weight:400;color:var(--sand-2);margin-left:6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .btn{font-weight:400}
.seg .btn.on{border-color:var(--torch);background:var(--torch-lo);color:var(--torch-hi);font-weight:700}
.mk-msg{color:var(--ember-hi);font-size:15px}
.mk-ok{color:var(--lapis-hi);font-weight:700}
.placeholder{display:grid;gap:10px;justify-items:center;text-align:center;color:var(--sand-3);max-width:34ch}
.placeholder svg{width:120px;height:auto;fill:none;stroke:var(--sand-3);stroke-width:1.5}

/* Estado */
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dot{width:11px;height:11px;transform:rotate(45deg);background:var(--stone-3);border:1px solid var(--line)}
.dot.ok{background:var(--lapis);border-color:var(--lapis)}.dot.bad{background:var(--ember);border-color:var(--ember)}.dot.done{background:var(--sand-3);border-color:var(--sand-3)}
.dot.cur{border-color:var(--torch-hi);box-shadow:0 0 0 2px var(--torch-lo)}
.lives{display:flex;gap:4px}
.lives .ico{width:22px;height:22px;color:var(--lapis);fill:var(--lapis-lo)}
.lives .ico.lost{color:var(--stone-3);fill:none}
.lives.hearts .ico{color:var(--ember);fill:var(--ember-lo)}
.lives.hearts .ico.lost{color:var(--stone-3);fill:none}
.timer{display:flex;align-items:center;gap:10px;min-width:230px}
.tbar{flex:1;height:10px;border-radius:99px;background:var(--stone-3);overflow:hidden;min-width:120px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--torch),var(--torch-hi));transition:width .1s linear}
.tbar.low i{animation:pulse .6s infinite}
.tnum{font:700 16px var(--f-mono);font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.combo{font:700 15px var(--f-mono);color:var(--torch-hi)}
.survn{font:700 30px var(--f-mono);color:var(--torch-hi);line-height:1}
.hg{width:26px;height:38px}
.hg-glass{fill:none;stroke:var(--sand-2);stroke-width:1.6;stroke-linecap:round}
.hg-sand{fill:var(--torch)}

/* Figuras */
.fig text{font-family:var(--f-mono);font-size:15px;font-weight:600;fill:var(--sand);paint-order:stroke;stroke:var(--stone);stroke-width:4px;stroke-linejoin:round}
.fig text.unk{fill:var(--torch-hi);font-size:19px;font-weight:700}
.fig text.area{font-size:17px}
.fig text.it{font-style:italic;font-size:19px;font-family:Georgia,serif}
.fig .tri{fill:rgba(240,230,207,.06);stroke:var(--sand);stroke-width:2.5;stroke-linejoin:round}
.fig .side-unk{stroke:var(--torch);stroke-width:3.5;stroke-dasharray:8 6;stroke-linecap:round;animation:flow 1.4s linear infinite}
.fig .ra{fill:none;stroke:var(--sand-2);stroke-width:1.6}
.fig .sq{stroke-width:1.6}
.sq-a{fill:var(--lapis-lo);stroke:var(--lapis)}.sq-b{fill:var(--torch-lo);stroke:var(--torch)}.sq-c{fill:var(--moss-lo);stroke:var(--moss)}
.sq-a.hl{fill:rgba(76,188,203,.4)}.sq-b.hl{fill:rgba(242,165,65,.4)}.sq-c.hl{fill:rgba(156,196,114,.42)}
.fig .hl{animation:glowpoly 1.6s ease-in-out infinite}
.fig .grid{stroke:var(--sand);stroke-width:.8;opacity:.32}
.fig .qarc{fill:none;stroke:var(--torch);stroke-width:2;stroke-dasharray:3 3}
.bridge .sky{fill:var(--stone)}
.bridge .far{fill:var(--stone-2);opacity:.8}
.bridge .rock{fill:var(--stone-3);stroke:var(--line);stroke-width:1.5}
.bridge .guide{stroke:var(--sand-3);stroke-width:1.6;stroke-dasharray:4 5}
.bridge .guide.unk{stroke:var(--torch);stroke-width:2.6}
.bridge .rope{stroke:var(--sand);stroke-width:3;stroke-linecap:round;stroke-dasharray:9 7}
.bridge .rope.unk{stroke:var(--torch);animation:flow 1.4s linear infinite}
.bridge.solved .rope{stroke:var(--torch-hi);stroke-dasharray:none;animation:none}
.bridge .walker{transition:transform 1.1s cubic-bezier(.45,0,.6,1)}
.bridge .mist{fill:var(--lapis);opacity:.06}
.ladder .wallr{fill:var(--stone-3);stroke:var(--line)}
.ladder .brick{stroke:var(--line);stroke-width:1}
.ladder .floor{stroke:var(--sand-3);stroke-width:2}
.ladder .rail{stroke:var(--torch);stroke-width:3;stroke-linecap:round}
.ladder .rung{stroke:var(--torch);stroke-width:2}
.ladder .rails-unk .rail,.ladder .rails-unk .rung{stroke-dasharray:6 5}
.ladder .guide{stroke:var(--sand-3);stroke-width:1.6;stroke-dasharray:4 5}
.ladder .guide.unk{stroke:var(--torch);stroke-width:2.6}
.figwrap{position:relative;width:100%;display:grid;place-items:center}
.gauge{position:absolute;right:4px;top:8px;bottom:8px;width:44px;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:6px;font:600 11px var(--f-mono);color:var(--sand-3)}
.g-track{position:relative;width:8px;border-radius:99px;background:var(--stone-3)}
.g-track i{position:absolute;left:0;right:0;top:0;border-radius:99px;background:linear-gradient(var(--lapis),var(--lapis-hi));transition:height .8s ease}
.g-av{position:absolute;left:50%;width:28px;height:56px;transform:translateX(-50%);transition:top .8s ease}
.door .wallbg{fill:var(--stone)}
.door .frame{fill:var(--stone-3);stroke:var(--line);stroke-width:2}
.door .light{fill:var(--torch-hi);opacity:.85}
.door .leafg{transition:transform 1.6s cubic-bezier(.6,0,.3,1)}
.door.open .leafg{transform:translateY(-200px)}
.door .leaf{fill:var(--night);stroke:var(--line);stroke-width:2}
.door .seal circle{fill:var(--stone-2);stroke:var(--sand-3);stroke-width:2}
.door .seal path{fill:none;stroke:var(--sand-3);stroke-width:1.6}
.door .seal.on circle{fill:var(--lapis-lo);stroke:var(--lapis);filter:drop-shadow(0 0 6px rgba(76,188,203,.8))}
.door .seal.new{transform-box:fill-box;transform-origin:center;animation:pop .6s both}
.door .seal text{font-size:20px;fill:var(--lapis-hi)}
.door .brick{stroke:var(--line);stroke-width:1}
.bossfig{display:grid;gap:12px;width:100%;justify-items:center}
.bossq{width:100%;display:grid;place-items:center;border-top:1px solid var(--line);padding-top:10px}
.bossq .fig{max-width:400px}
.guardian{position:relative;width:100%;display:grid;gap:8px;justify-items:center}
.g-svg{width:min(100%,280px)}
.g-body,.g-head,.g-arm{fill:var(--stone-3);stroke:var(--line);stroke-width:2}
.g-eye{fill:var(--torch);filter:drop-shadow(0 0 6px rgba(242,165,65,.9));animation:glow 2.4s ease-in-out infinite}
.g-rune{fill:none;stroke:var(--torch);stroke-width:2.2}
.g-mouth{stroke:var(--sand-3);stroke-width:3;stroke-linecap:round}
.g-crack{fill:none;stroke:var(--night);stroke-width:2.5;stroke-linecap:round;transition:opacity .4s}
.guardian.hit .g-svg{animation:shake .45s}
.guardian.hit .g-eye{fill:var(--ember-hi)}
.guardian.attack .g-svg{animation:lunge .55s ease}
.guardian.attack .g-eye{fill:var(--ember)}
.dmg{position:absolute;top:30%;left:50%;font:700 34px var(--f-mono);color:var(--torch-hi);text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;animation:dmg 1s ease forwards}
.hp{display:flex;align-items:center;gap:10px;width:min(100%,340px);font:700 13px var(--f-mono)}
.hpbar{flex:1;height:12px;background:var(--stone-3);border-radius:99px;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--torch));transition:width .45s}

/* Intro, info, lab */
.intro{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 24px;padding:28px;border-radius:16px;background:linear-gradient(160deg,var(--stone-2),var(--stone));border:1px solid var(--line);max-width:900px;align-items:start}
.intro-art{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:var(--stone-3);border:2px solid var(--torch);box-shadow:0 0 40px rgba(242,165,65,.25)}
.intro-art svg{width:64px;height:64px;fill:none;stroke:var(--torch-hi);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.intro-txt{display:grid;gap:14px;min-width:0}
.intro ul{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--sand-2)}
.intro .btn{justify-self:start}
@media (max-width:600px){.intro{grid-template-columns:1fr}}
.seal-formula{font:700 clamp(30px,5vw,46px) var(--f-mono);color:var(--torch-hi);text-align:center;padding:14px;border:1px solid var(--torch);border-radius:12px;background:var(--torch-lo)}
.info ul{margin:0;padding-left:20px;display:grid;gap:6px}
.sliders{display:grid;gap:8px}
.sliders label{display:flex;justify-content:space-between;font-weight:700}
.sliders output{font-family:var(--f-mono);color:var(--torch-hi)}
input[type=range]{width:100%;accent-color:var(--torch)}
.labeq{font:600 18px var(--f-mono);display:grid;gap:4px;padding:14px;border-radius:10px;background:var(--stone);border:1px solid var(--line);overflow-x:auto}
.labmsg{min-height:1.5em}
.labmsg.win{color:var(--moss);font-weight:700}

/* Resumen */
.summary{display:grid;place-items:center;padding-block:34px}
.sum-card{width:100%;max-width:760px;display:grid;gap:18px;justify-items:center;text-align:center;padding:30px 26px;border-radius:16px;background:linear-gradient(160deg,var(--stone-2),var(--stone));border:1px solid var(--line)}
.sum-art svg{width:180px;height:auto}
.bigstars{display:flex;gap:10px}
.bst{width:58px;height:58px;fill:var(--stone-3);stroke:var(--sand-3);stroke-width:1}
.bst.on{fill:var(--torch);stroke:var(--torch-hi);animation:pop .5s both}
.grade{font:700 clamp(64px,10vw,96px)/1 var(--f-mono);color:var(--torch-hi)}
.grade small{font-size:.35em;color:var(--sand-2)}
.sumstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%;margin:0}
.sumstats div{padding:12px;border-radius:10px;background:var(--stone);border:1px solid var(--line)}
.sumstats dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--sand-2)}
.sumstats dd{margin:2px 0 0;font:700 26px var(--f-mono);color:var(--torch-hi)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.nr{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.nr span{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;border:1px solid var(--torch);background:var(--torch-lo);font-weight:700}
.nr svg{width:22px;height:22px;fill:none;stroke:var(--torch-hi);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.review{display:grid;gap:8px;width:100%;text-align:left}
.rev{border-radius:10px;border:1px solid var(--line);background:var(--stone)}
.rev summary{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev-n{font:700 15px var(--f-mono);color:var(--sand-3)}
.rev-q{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rev-a{font:700 14px var(--f-mono)}
.rev.ok .rev-a{color:var(--lapis-hi)}.rev.bad .rev-a{color:var(--ember-hi)}
.rev .fb-body{padding:0 14px 14px}

/* Modal, avisos, ábaco */
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:20px}
.modal-card{position:relative;background:var(--stone-2);border:1px solid var(--line);border-radius:16px;max-width:880px;width:100%;max-height:min(88vh,940px);overflow:auto;padding:28px;display:grid;gap:18px}
.modal-x{position:absolute;top:14px;right:14px}
.relics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.relic{display:grid;gap:6px;justify-items:center;text-align:center;padding:16px 12px;border-radius:12px;background:var(--stone);border:1px solid var(--line)}
.relic svg{width:46px;height:46px;fill:none;stroke:var(--torch-hi);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.relic b{font-family:var(--f-display);font-weight:400;font-size:17px}
.relic span{font-size:14px;color:var(--sand-2)}
.relic.off svg{stroke:var(--stone-3)}
.relic.off b{color:var(--sand-3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpis div{background:var(--stone);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:2px}
.kpis b{font:700 26px var(--f-mono);color:var(--torch-hi);font-variant-numeric:tabular-nums}
.kpis span{font-size:14px;color:var(--sand-2)}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 3ch;gap:12px;align-items:center;font-size:15px}
.bar{height:10px;background:var(--stone-3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ember)}
.bar-row b{font-family:var(--f-mono);text-align:right}
.advice{padding:14px 16px;border-radius:10px;border:1px solid var(--lapis);background:var(--lapis-lo)}
.chlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.chlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:var(--stone);font-size:15px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:14px;color:var(--sand-2);font-weight:700}
.field input:not([type=range]),.field select{font:600 17px var(--f-body);padding:9px 12px;border-radius:9px;border:2px solid var(--line);background:var(--night);color:var(--sand);width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--torch)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--torch);flex:none}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.diff{display:grid;gap:4px;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--stone);color:var(--sand);font:inherit;cursor:pointer}
.diff b{font-family:var(--f-display);font-weight:400;font-size:20px}
.diff span{font-size:14px;color:var(--sand-2)}
.diff.on{border-color:var(--torch);background:var(--torch-lo)}
.diff.on b{color:var(--torch-hi)}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.topic{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--stone);color:var(--sand);font:inherit;cursor:pointer}
.topic .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--sand-3);display:grid;place-items:center;flex:none}
.topic.on{border-color:var(--lapis);background:var(--lapis-lo)}
.topic.on .box{border-color:var(--lapis);background:var(--lapis)}
.topic.on .box::after{content:"";width:8px;height:12px;border:solid var(--night);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:10px;max-width:calc(100vw - 32px)}
.toast{display:flex;gap:12px;align-items:center;background:var(--stone-2);border:1px solid var(--torch);border-radius:12px;padding:12px 16px;box-shadow:0 12px 30px var(--shadow);animation:rise .3s}
.toast svg{width:34px;height:34px;fill:none;stroke:var(--torch-hi);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.toast small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--torch)}
.banner{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:70;text-align:center;padding:26px 40px;border-radius:16px;background:var(--stone-2);border:2px solid var(--torch);box-shadow:0 20px 60px var(--shadow);animation:popb .45s both;max-width:calc(100vw - 32px)}
.banner-t{font-family:var(--f-display);font-size:clamp(26px,4vw,38px);color:var(--torch-hi)}
.calc{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:290px;max-width:calc(100vw - 32px);background:var(--stone-2);border:1px solid var(--torch);border-radius:14px;padding:14px;display:grid;gap:8px;box-shadow:0 16px 40px var(--shadow)}
.calc-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:18px;color:var(--torch-hi)}
.calc-in{font:600 20px var(--f-mono);padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:var(--night);color:var(--sand);width:100%}
.calc-in:focus{outline:none;border-color:var(--torch)}
.calc-out{font:700 22px var(--f-mono);color:var(--torch-hi);text-align:right;min-height:1.4em}
.calc-keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.calc-keys .btn{padding:10px 0;font:600 17px var(--f-mono)}
.calc-keys .k3{grid-column:span 3}.calc-keys .k2{grid-column:span 2}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}
.flash{position:fixed;inset:0;pointer-events:none;z-index:75;opacity:0}
.flash.ok{background:radial-gradient(circle at 50% 50%,transparent 40%,rgba(76,188,203,.28));animation:flash .5s ease}
.flash.bad{background:radial-gradient(circle at 50% 50%,transparent 35%,rgba(230,106,80,.4));animation:flash .55s ease}
.flyxp{position:fixed;z-index:85;pointer-events:none;font:700 18px var(--f-mono);color:var(--torch-hi);text-shadow:0 2px 8px rgba(0,0,0,.6)}

/* Expediciones */
.exp-layout{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:18px;align-items:start;margin-top:18px}
@media (max-width:820px){.exp-layout{grid-template-columns:1fr}}
.exp-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.exp-item{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:10px;background:var(--stone);border:1px solid var(--line);color:var(--sand);font:inherit;cursor:pointer}
.exp-item.on{border-color:var(--torch);background:var(--stone-2)}
.exp-st{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sand-3);font-weight:700;flex:none}
.exp-item.done .exp-st{color:var(--moss)}
.steps{margin:0;padding-left:22px;display:grid;gap:6px}

/* Cine y atmósfera */
body[data-view=title] .top{display:none}
#dark{position:fixed;inset:0;pointer-events:none;z-index:30;--mx:50%;--my:40%;--lr:240px;--da:.42;background:radial-gradient(circle at var(--mx) var(--my),transparent 0,transparent var(--lr),rgba(6,5,10,var(--da)) calc(var(--lr) * 2.8)),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.5) 100%);animation:lightflick 7s ease-in-out infinite}
body[data-view=title] #dark{--da:.55;--lr:230px}
body[data-view=map] #dark{--da:.42;--lr:300px}
body[data-view=codex] #dark{--da:.3;--lr:360px}
body[data-view=play] #dark{--da:.12;--lr:440px}
body[data-view=summary] #dark{--da:.28;--lr:380px}
#grain{position:fixed;left:-50%;top:-50%;width:200%;height:200%;pointer-events:none;z-index:32;opacity:.06;mix-blend-mode:overlay;animation:grain 1.2s steps(6) infinite}
.curtain{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none;background:#07060a}
.curtain.block{pointer-events:auto;cursor:pointer}
.cur-card{display:grid;gap:16px;justify-items:center;text-align:center;padding:24px;max-width:min(780px,calc(100vw - 32px));opacity:0;transition:opacity .5s ease}
.cur-card.show{opacity:1}
.cur-emb{width:84px;height:84px;fill:none;stroke:var(--torch-hi);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 14px rgba(242,165,65,.6))}
.cur-card.show .cur-emb path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s ease forwards}
.cur-k{font:700 13px var(--f-body);letter-spacing:.5em;text-transform:uppercase;color:var(--torch);padding-left:.5em}
.cur-t{font-family:var(--f-display);font-size:clamp(32px,5.5vw,64px);line-height:1.05;color:var(--sand);text-wrap:balance}
.cur-p{font-size:clamp(17px,2vw,22px);line-height:1.65;color:var(--sand-2);max-width:48ch;opacity:0;animation:fadeUp 1.4s .9s ease forwards}
.cur-p b{color:var(--torch-hi);font-weight:400;font-family:var(--f-display)}
.cur-line{width:200px;height:1px;background:linear-gradient(90deg,transparent,var(--torch),transparent);transform:scaleX(0)}
.cur-card.show .cur-line{animation:line 1.3s .3s ease forwards}
.cur-skip{font-size:13px;color:var(--sand-3);letter-spacing:.12em;text-transform:uppercase;opacity:0;animation:fadeUp 1s 2.5s ease forwards}
.rw{display:inline-block;white-space:nowrap}
.rl{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(8px);animation:rl .9s cubic-bezier(.2,.7,.2,1) forwards}
#view.arrive{animation:arrive .9s cubic-bezier(.2,.7,.2,1)}
.stage.enter>*{animation:arriveSm .45s cubic-bezier(.2,.7,.2,1) both}
.stage.leave>*{animation:leave .23s ease forwards}
.modal{animation:fadeIn .35s ease;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal .modal-card{animation:cardIn .5s cubic-bezier(.2,.8,.2,1)}
.modal.closing{animation:fadeOut .22s ease forwards}
.modal.closing .modal-card{animation:cardOut .22s ease forwards}
.mapwrap>div:first-child{perspective:1400px}
.tmap{will-change:transform}
.fog{pointer-events:none}
.fog .fg{fill:var(--sand-3);opacity:.34;transform-box:fill-box;transform-origin:center;animation:drift 8s ease-in-out infinite alternate}
.fog .f2{animation-duration:11s;opacity:.28}.fog .f3{animation-duration:9.5s;opacity:.24}
.fog.clearing .fg{animation:fogOut 1.8s ease forwards}
.node.fogged .n-emb,.node.fogged .n-num{opacity:0}
.node.fogged .n-name{fill:var(--sand-3);letter-spacing:.3em}
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s ease;pointer-events:none}
.btn.primary:hover::after{transform:translateX(120%)}
.mode:hover:not(:disabled){box-shadow:0 0 0 1px var(--lapis),0 12px 40px rgba(76,188,203,.16)}
.bigstars.wait .bst.on{animation:none;opacity:0}
.echo{display:grid;gap:4px;padding:12px 16px;border-left:2px solid var(--torch);background:var(--torch-lo);border-radius:0 10px 10px 0;font-size:16px;color:var(--sand)}
.echo span{font:700 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--torch)}
/* Códice */
.codex{display:grid;gap:22px;padding-block:24px 0}
.tl{position:relative;display:flex;overflow-x:auto;padding:12px 4px 18px;scroll-snap-type:x proximity}
.tl::before{content:"";position:absolute;left:40px;right:40px;top:50px;height:2px;background:linear-gradient(90deg,transparent,var(--line) 4%,var(--line) 96%,transparent)}
.tl-item{position:relative;flex:0 0 118px;display:grid;justify-items:center;gap:6px;background:none;border:0;color:var(--sand);font:inherit;cursor:pointer;padding:0 4px;scroll-snap-align:center;text-align:center}
.sage-med{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--stone-3);border:2px solid var(--line);transition:border-color .2s,box-shadow .2s,transform .2s}
.sage-med svg{width:38px;height:38px;fill:none;stroke:var(--torch-hi);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tl-item:hover .sage-med{transform:translateY(-3px);border-color:var(--torch)}
.tl-item.on .sage-med{border-color:var(--torch-hi);box-shadow:0 0 0 4px var(--torch-lo),0 0 30px rgba(242,165,65,.35)}
.tl-item.done .sage-med{border-color:var(--torch)}
.tl-item.lockd .sage-med{background:var(--stone-2);border-style:dashed}
.tl-item.lockd .sage-med svg{stroke:var(--sand-3)}
.tl-name{font-family:var(--f-display);font-size:15px;line-height:1.2}
.tl-year{font:600 11px var(--f-mono);color:var(--sand-3)}
.tl-item.lockd .tl-name{color:var(--sand-3)}
.sage{display:grid;gap:16px;max-width:900px}
.sage-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.sage .sage-med{width:96px;height:96px}
.sage .sage-med svg{width:50px;height:50px}
.sage-text{font-size:18px;line-height:1.7;max-width:66ch}
.sage-link{padding:14px 16px;border-radius:12px;background:var(--stone);border:1px solid var(--line);display:grid;gap:6px}
.sage-quiz{display:grid;gap:10px;padding-top:6px;border-top:1px dashed var(--line)}
@media (max-width:600px){.sage-head{grid-template-columns:auto minmax(0,1fr)}.sage-head .btn{grid-column:1/-1;justify-self:start}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.45}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes popb{0%{transform:translateX(-50%) scale(.6);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes flicker{0%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.12) scaleX(.92)}100%{transform:scaleY(.94) scaleX(1.05)}}
@keyframes glow{50%{opacity:.6}}
@keyframes twinkle{50%{opacity:.25}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes halo{0%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes glowpoly{50%{opacity:.65}}
@keyframes lunge{0%,100%{transform:scale(1)}40%{transform:scale(1.12) translateY(10px)}}
@keyframes dmg{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes rl{to{opacity:1;filter:blur(0);transform:none}}
@keyframes arrive{from{opacity:0;filter:blur(10px);transform:scale(1.015)}to{opacity:1;filter:none;transform:none}}
@keyframes arriveSm{from{opacity:0;filter:blur(6px);transform:translateY(12px)}to{opacity:1;filter:none;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-10px);filter:blur(6px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes line{to{transform:scaleX(1)}}
@keyframes drift{from{transform:translate(-8px,4px) scale(1)}to{transform:translate(10px,-6px) scale(1.12)}}
@keyframes fogOut{to{opacity:0;transform:scale(2.2)}}
@keyframes lightflick{0%,100%{opacity:1}22%{opacity:.93}24%{opacity:1}61%{opacity:.96}63%{opacity:1}}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-5%,3%)}40%{transform:translate(3%,-6%)}60%{transform:translate(-7%,2%)}80%{transform:translate(4%,5%)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rl,.cur-p,.cur-skip{opacity:1!important;filter:none!important;transform:none!important}.cur-emb path{stroke-dashoffset:0!important}.cur-line{transform:none!important}}

/* =========================================================
   v2.0 · idiomas, retratos, escenas, redacciones, figuras nuevas
   ========================================================= */
.portrait{width:100%;height:auto;display:block}
.langsw{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--stone);justify-self:start}
.lang-btn{font:700 14px var(--f-body);color:var(--sand-2);background:none;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;min-height:36px}
.lang-btn.on{background:var(--torch);color:#1b1206}
.lang-btn:focus-visible{outline:2px solid var(--torch-hi);outline-offset:2px}
.title-art{position:relative}
.title-cast{position:absolute;inset:auto 0 -6% 0;display:flex;justify-content:space-between;pointer-events:none}
.tc-p{width:24%;filter:drop-shadow(0 14px 22px rgba(0,0,0,.6))}
.tc-l{margin-left:-2%}.tc-r{margin-right:-2%}
.tc-p .portrait{animation:breathe 5s ease-in-out infinite}.tc-r .portrait{animation-delay:-2.5s}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mp-sage{display:flex;align-items:flex-end;gap:10px;margin-top:-6px}
.mp-sage .portrait{width:92px;flex:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.mp-sage span{font:600 13px var(--f-mono);color:var(--sand-3);padding-bottom:10px}
.intro-art{position:relative}
.intro-cast{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);display:flex;width:180px;gap:0}
.ic-p{width:90px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
@media (max-width:600px){.intro-cast{display:none}}
.chips .chip[data-act="lang"] b{font-family:var(--f-mono)}
/* --- escenas con personajes --- */
.talk{position:fixed;inset:0;z-index:60;background:#07060a;overflow:hidden}
.tk-scene{position:absolute;inset:0;transition:filter .6s}
.tk-scene .scene{width:100%;height:100%;display:block}
.tk-scene.fade{animation:tkFade .6s ease}
@keyframes tkFade{from{opacity:0}to{opacity:1}}

const B64=u8=>{let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s);};
const UNB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function zip(str,inflate){const CS=inflate?window.DecompressionStream:window.CompressionStream;if(!CS)return null;
  const st=new Blob([str]).stream().pipeThrough(new CS('deflate-raw'));return new Uint8Array(await new Response(st).arrayBuffer());}
async function saveCode(){const json=JSON.stringify(S);let body,tag;try{const z=await zip(new TextEncoder().encode(json));if(z){body=B64(z);tag='Z';}}catch(e){}
  if(!body){body=B64(new TextEncoder().encode(json));tag='P';}
  let sum=0;for(const ch of body)sum=(sum*31+ch.charCodeAt(0))>>>0;return `PITA1${tag}-${(sum%46656).toString(36).padStart(3,'0')}-${body}`;}
async function readCode(code){const m=String(code).trim().replace(/\s+/g,'').match(/^PITA1([ZP])-([0-9a-z]{3})-([A-Za-z0-9+/=]+)$/);if(!m)throw new Error('format');
  let sum=0;for(const ch of m[3])sum=(sum*31+ch.charCodeAt(0))>>>0;if((sum%46656).toString(36).padStart(3,'0')!==m[2])throw new Error('sum');
  const raw=UNB64(m[3]);const bytes=m[1]==='Z'?await zip(raw,true):raw;if(!bytes)throw new Error('zip');const o=JSON.parse(new TextDecoder().decode(bytes));
  if(!o||typeof o!=='object'||typeof o.xp!=='number'||!o.stars)throw new Error('data');return o;}

const AU={ctx:null,cur:null,want:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const ctx=new C();AU.ctx=ctx;
    AU.master=ctx.createGain();AU.master.gain.value=S.audio.muted?0:1;
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
    AU.master.connect(comp).connect(ctx.destination);
    AU.rev=ctx.createConvolver();AU.rev.buffer=impulse(ctx,2.6,2.4);AU.rev.connect(AU.master);
    AU.music=ctx.createGain();AU.music.gain.value=S.audio.music;
    AU.duck=ctx.createGain();AU.duck.gain.value=1;
    AU.music.connect(AU.duck);AU.duck.connect(AU.master);
    const ms=ctx.createGain();ms.gain.value=.38;AU.duck.connect(ms).connect(AU.rev);
    AU.sfx=ctx.createGain();AU.sfx.gain.value=S.audio.sfx;AU.sfx.connect(AU.master);
    const ss=ctx.createGain();ss.gain.value=.18;AU.sfx.connect(ss).connect(AU.rev);
    AU.noise=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const nd=AU.noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    AU.timer=setInterval(musicTick,40);
    if(AU.want){const w=AU.want;AU.want=null;musicPlay(w);}
  }catch(e){AU.ctx=null;}
}
function impulse(ctx,dur,decay){const r=ctx.sampleRate,len=Math.floor(r*dur),b=ctx.createBuffer(2,len,r);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}return b;}
function applyVolumes(){if(!AU.ctx)return;const t=AU.ctx.currentTime;AU.music.gain.setTargetAtTime(S.audio.music,t,.05);AU.sfx.gain.setTargetAtTime(S.audio.sfx,t,.05);AU.master.gain.setTargetAtTime(S.audio.muted?0:1,t,.05);}
function duck(on){if(!AU.ctx)return;AU.duck.gain.setTargetAtTime(on?.3:1,AU.ctx.currentTime,.15);}
/* instrumentos */
function osc(type,f,t){const o=AU.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);return o;}
function gainEnv(t,a,peak,hold,rel){const g=AU.ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+a);g.gain.setValueAtTime(Math.max(peak,0.0002),t+a+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+rel);return g;}

const AMB={type:'embers',ps:[],raf:0};
function setScene(type){if(AMB.type===type)return;AMB.type=type;AMB.ps=[];if(!AMB.raf&&!reduced())AMB.raf=requestAnimationFrame(ambLoop);}
function ambSpawn(type,W,H,init){
  const r=Math.random;const base={x:r()*W,y:init?r()*H:H+10,vx:(r()-.5)*.3,vy:-(r()*.5+.2),s:r()*1.6+.6,a:r()*.35+.1,ph:r()*6};
  if(type==='drops')return Object.assign(base,{y:init?r()*H:-10,vy:r()*2.5+2,vx:0,s:1,a:.22});
  if(type==='sand')return Object.assign(base,{y:init?r()*H:-10,vy:r()*1.2+.6,vx:(r()-.5)*.2,a:.25});
  if(type==='dust')return Object.assign(base,{vy:(r()-.5)*.2,vx:(r()-.5)*.25,a:r()*.12+.04});
  if(type==='sparks')return Object.assign(base,{vy:-(r()*1.2+.4),a:r()*.4+.15});
  if(type==='stars')return Object.assign(base,{y:r()*H*.6,vy:0,vx:0,a:r()*.5+.1});
  return base;
}
function ambLoop(){
  AMB.raf=requestAnimationFrame(ambLoop);
  if(document.hidden)return;
  const cv=$('#amb'),ctx=cv.getContext('2d');if(cv.width!==innerWidth||cv.height!==innerHeight){cv.width=innerWidth;cv.height=innerHeight;}
  const W=cv.width,H=cv.height,type=AMB.type,want={embers:34,dust:40,drops:36,sand:60,sparks:44,stars:70}[type]||0;
  while(AMB.ps.length<want)AMB.ps.push(ambSpawn(type,W,H,true));
  const col={embers:tok('--torch'),dust:tok('--sand'),drops:tok('--lapis-hi'),sand:tok('--torch-hi'),sparks:tok('--ember-hi'),stars:tok('--sand')}[type];
  ctx.clearRect(0,0,W,H);ctx.fillStyle=col;ctx.strokeStyle=col;
  AMB.ps.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.ph+=.03;
    const out=p.y<-20||p.y>H+20||p.x<-20||p.x>W+20;if(out){AMB.ps[i]=ambSpawn(type,W,H,false);return;}
    const al=type==='stars'||type==='embers'||type==='sparks'?p.a*(.6+.4*Math.sin(p.ph)):p.a;ctx.globalAlpha=al;
    if(type==='drops'){ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-8);ctx.stroke();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill();}});
  ctx.globalAlpha=1;
}

function fitter(pts,W,H,P){
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const s=Math.min((W-2*P)/((maxx-minx)||1),(H-2*P)/((maxy-miny)||1));
  const ox=(W-(maxx-minx)*s)/2,oy=(H-(maxy-miny)*s)/2;
  return ([x,y])=>[ox+(x-minx)*s,H-(oy+(y-miny)*s)];
}

function diagnose(q,x){
  const m=q.meta||{},N=v=>near(x,v);
  if(m.diag){const d=m.diag(x,N);if(d)return d;}
  if(m.digitOf!=null&&N(m.digitOf))return['lectura',t('Piège de lecture','Trampa de lectura'),t(`Ton calcul (${fmt(m.digitOf)}) est juste, mais la serrure ne demandait que <b>${m.digitWhat}</b>. Lis toujours la dernière phrase.`,`Tu cálculo (${fmt(m.digitOf)}) es correcto, pero la cerradura pedía solo <b>${m.digitWhat}</b>. Lee siempre la última frase.`)];
  if(m.digitAlt!=null&&N(m.digitAlt))return['lectura',t('Piège de lecture','Trampa de lectura'),m.digitAltMsg];
  if(m.ask==='ahorro'){if(N(m.c))return['lectura',t('Piège de lecture','Trampa de lectura'),t(`Tu as calculé la diagonale (${fmt(m.c)}), mais on te demandait <b>combien on économise</b>. Il fallait soustraire : chemin long − diagonale.`,`Has calculado la diagonal (${fmt(m.c)}), pero te preguntaban <b>cuánto se ahorra</b>. Faltaba restar: camino largo − diagonal.`)];if(N(m.p+m.q))return['lectura',t('Piège de lecture','Trampa de lectura'),t('Ça, c’est le chemin long. On te demandait combien on <b>économise</b> en passant par la diagonale.','Ese es el camino largo. Te preguntaban cuánto se <b>ahorra</b> yendo en diagonal.')];}
  if(m.unitAlt&&m.unitAlt.some(N))return['unidades',t('Unités mélangées','Unidades mezcladas'),t('Il y avait une donnée en centimètres et une autre en mètres. Avant de calculer, convertis tout en mètres, comme le demande la question.','Había un dato en centímetros y otro en metros. Antes de calcular, pásalo todo a metros, que es lo que pide la pregunta.')];
  if(m.mode==='hyp'){const{p,q:qq}=m;if(N(Math.sqrt(Math.abs(p*p-qq*qq))))return['lectura',t('Quel côté manquait ?','¿Qué lado faltaba?'),t('Tu as soustrait comme si tu cherchais un côté de l’angle droit. Ici il manque l’<b>hypoténuse</b>, le plus grand côté, en face de l’angle droit : les carrés s’additionnent.','Has restado como si buscaras un cateto. Aquí falta la <b>hipotenusa</b>, el lado largo enfrente del ángulo recto: los cuadrados se suman.')];if(N(p*p+qq*qq))return['raiz',t('Il manquait la racine','Te faltó la raíz'),t('Tu es arrivé à c², c’est l’aire du grand carré. Le côté, c’est sa <b>racine carrée</b>.','Has llegado a c², que es el área del cuadrado grande. El lado es su <b>raíz cuadrada</b>.')];if(N(p+qq))return['suma',t('Tu as additionné les côtés, pas les carrés','Sumaste lados, no cuadrados'),t('Pythagore n’additionne pas les côtés : il additionne leurs <b>carrés</b>, puis prend la racine.','Pitágoras no suma los lados: suma sus <b>cuadrados</b> y después hace la raíz.')];}
  if(m.mode==='cat'){const{h,p}=m;if(N(Math.sqrt(h*h+p*p)))return['lectura',t('Quel côté manquait ?','¿Qué lado faltaba?'),t(`Tu as additionné comme si tu cherchais l’hypoténuse, mais tu l’avais déjà (${fmt(h)}). Il manquait un <b>côté de l’angle droit</b> : les carrés se soustraient.`,`Has sumado como si buscaras la hipotenusa, pero la hipotenusa ya la tenías (${fmt(h)}). Faltaba un <b>cateto</b>: los cuadrados se restan.`)];if(N(h*h-p*p))return['raiz',t('Il manquait la racine','Te faltó la raíz'),t('Tu es arrivé à x². Maintenant prends la <b>racine carrée</b>.','Has llegado a x². Ahora haz la <b>raíz cuadrada</b>.')];if(N(h-p)||N(h+p))return['suma',t('Tu as soustrait les côtés, pas les carrés','Restaste lados, no cuadrados'),t('D’abord on élève au carré, puis on soustrait, et à la fin on prend la racine.','Primero eleva al cuadrado, después resta y al final haz la raíz.')];}
  if(m.mode==='sq'){if(N(m.side))return['lectura',t('On demandait des carreaux','Te pedían baldosas'),t('Tu as donné la longueur du côté. La question demandait combien de <b>carreaux</b> a le carré (son aire).','Has dado la medida del lado. La pregunta era cuántas <b>baldosas</b> tiene el cuadrado (su área).')];if(N(m.parts[0]+m.parts[1]))return['suma',t('Tu as additionné les côtés','Sumaste lados'),t('Additionne les carreaux des deux carrés, pas les longueurs des côtés.','Suma las baldosas de los dos cuadrados, no las medidas de los lados.')];}
  if(m.mode==='sqd'&&N(m.big+m.small))return['lectura',t('Additionner ou soustraire ?','¿Sumar o restar?'),t('Le grand carré, tu l’avais déjà. Pour trouver le petit qui manque, il faut <b>soustraire</b>.','El cuadrado grande ya lo tenías. Para encontrar el pequeño que falta hay que <b>restar</b>.')];
  if(m.mode==='sqside'){if(N(m.area))return['lectura',t('On demandait le côté','Te pedían el lado'),t('Ce nombre, ce sont les carreaux. La question demande la longueur du côté : sa racine carrée.','Ese número son las baldosas. La pregunta pide cuánto mide el lado: su raíz cuadrada.')];if(N(m.area/2))return['raiz',t('La racine n’est pas la moitié','La raíz no es la mitad'),t('La racine carrée est le nombre qui, multiplié par lui-même, donne l’aire.','La raíz cuadrada es el número que multiplicado por sí mismo da el área.')];}

  return {kind:'num',type:'map',topic:'dist',answer:d,unit:'m',trap:true,prompt:t(`Sur la carte au trésor, chaque carreau représente <b>${scale} m</b>. Depuis le puits, le trésor est à ${dx} carreaux vers l’est et ${dy} vers le nord. À quelle distance réelle, en ligne droite ?`,`En el mapa del tesoro, cada cuadradito representa <b>${scale} m</b>. Desde el pozo, el tesoro está ${dx} cuadraditos al este y ${dy} al norte. ¿A qué distancia real en línea recta?`),
    fig:()=>figGrid({pts:[[1,1],[1+dx,1+dy]],names:['',''],tri:true,axes:false,nx:Math.max(10,dx+2),ny:Math.max(8,dy+2),icons:[['◎',[1,1]],['✕',[1+dx,1+dy]]]}),hint:t('Calcule d’abord la distance en carreaux, puis multiplie par l’échelle.','Calcula primero la distancia en cuadraditos y después multiplica por la escala.'),
    explain:`<span class="m">${t('en carreaux','en cuadraditos')} : √(${dx}² + ${dy}²) = √${dx*dx+dy*dy} = ${fmt(Math.hypot(dx,dy))}</span><span class="m">${t('réel','real')} : ${fmt(Math.hypot(dx,dy))} × ${scale} = ${fmt(d)} m</span>`,
    meta:{mode:'map',diag:(x,N)=>N(Math.hypot(dx,dy))?['unidades',t('N’oublie pas l’échelle','No olvides la escala'),t(`C’est la distance en carreaux. Chaque carreau vaut ${scale} m.`,`Esa es la distancia en cuadraditos. Cada uno vale ${scale} m.`)]:N((dx+dy)*scale)?['suma',t('À vol d’oiseau','En línea recta'),t('Tu as additionné les deux trajets. En ligne droite, c’est l’hypoténuse.','Has sumado los dos trayectos. En línea recta es la hipotenusa.')]:null}};}
/* ---------- DISTANCIAS EN EL ESPACIO ---------- */
const T3=[[2,3,6,7],[1,4,8,9],[4,4,7,9],[2,6,9,11],[6,6,7,11],[3,4,12,13],[2,10,11,15],[1,12,12,17],[8,9,12,17],[12,15,16,25]];
function qBoxFace(){const [l,p,h]=pick(T3),L=pick([3,4,6,8]),P=L===3?4:L===6?8:L===4?3:6,f=Math.hypot(L,P);
  return {kind:'num',type:'boxf',topic:'dist',answer:f,prompt:t(`ABCDEFGH est un pavé droit : AB = ${L}, BC = ${P} et BF = ${h}. Calcule la diagonale AC de la face ABCD.`,`ABCDEFGH es un ortoedro: AB = ${L}, BC = ${P} y BF = ${h}. Calcula la diagonal AC de la cara ABCD.`),
    fig:()=>figBox({L,P,H:h,lL:String(L),lP:String(P),lH:String(h),face:true,lF:'?',unk:'face',verts:true}),hint:t('Le triangle ABC est rectangle en B, dans la face du bas.','El triángulo ABC es rectángulo en B, en la cara de abajo.'),
    explain:`<span>${t('ABC est rectangle en B :','ABC es rectángulo en B:')}</span><span class="m">AC² = AB² + BC² = ${L*L} + ${P*P} = ${L*L+P*P}</span><span class="m">AC = √${L*L+P*P} = ${fmt(f)}</span><span>${t(`La hauteur BF = ${h} ne servait à rien ici !`,`¡La altura BF = ${h} no hacía falta aquí!`)}</span>`,trap:true,meta:{mode:'hyp',p:L,q:P,c:f}};}
function qBoxSpace(){const [l,p,h,d]=pick(S.diff==='aprendiz'?T3.slice(0,6):T3),f2=l*l+p*p;
  return {kind:'num',type:'boxs',topic:'dist',answer:d,prompt:t(`ABCDEFGH est un pavé droit : AB = ${l}, BC = ${p} et CG = ${h}. Calcule la grande diagonale AG.`,`ABCDEFGH es un ortoedro: AB = ${l}, BC = ${p} y CG = ${h}. Calcula la diagonal del espacio AG.`),
    fig:()=>figBox({L:l,P:p,H:h,lL:String(l),lP:String(p),lH:String(h),face:true,space:true,lS:'?',unk:'space',verts:true}),hint:t('Deux étapes : calcule AC² dans la face du bas (ABC rectangle en B), puis AG dans le triangle ACG rectangle en C.','Dos pasos: calcula AC² en la cara de abajo (ABC rectángulo en B), y después AG en el triángulo ACG, rectángulo en C.'),
    explain:`<span>${t('1. Dans ABC, rectangle en B :','1. En ABC, rectángulo en B:')}</span><span class="m">AC² = ${l}² + ${p}² = ${f2}</span><span>${t('2. Dans ACG, rectangle en C :','2. En ACG, rectángulo en C:')}</span><span class="m">AG² = AC² + CG² = ${f2} + ${h*h} = ${d*d}</span><span class="m">AG = √${d*d} = ${d}</span><span>${t('Raccourci : AG² = AB² + BC² + CG².','Atajo: AG² = AB² + BC² + CG².')}</span>`,
    meta:{mode:'box',diag:(x,N)=>N(Math.sqrt(f2))?['pasos',t('Une étape de plus','Falta un paso'),t('Ça, c’est AC, la diagonale de la face. Il reste à monter jusqu’à G avec CG.','Esa es AC, la diagonal de la cara. Falta subir hasta G con CG.')]:N(Math.hypot(l,h))||N(Math.hypot(p,h))?['pasos',t('Il manque une dimension','Falta una dimensión'),t('La grande diagonale utilise les trois dimensions du pavé.','La diagonal del espacio usa las tres dimensiones.')]:N(l+p+h)?['suma',t('Tu as additionné les longueurs','Sumaste longitudes'),t('On additionne les carrés, puis on prend la racine.','Se suman los cuadrados y después se hace la raíz.')]:N(f2+h*h)?['raiz',t('Il manquait la racine','Te faltó la raíz'),'']:null}};}
function qBoxFit(){const C=pick([{l:30,p:20,h:12,r:40,ok:false,d:38},{l:30,p:20,h:12,r:36,ok:true,d:38},{l:40,p:30,h:120,r:125,ok:true,d:130},{l:60,p:40,h:30,r:80,ok:false,d:Math.hypot(60,40,30)}]);
  const d=Math.hypot(C.l,C.p,C.h);
  return mkChoice({type:'boxfit',topic:'dist',prompt:t(`Une boîte mesure ${C.l} cm × ${C.p} cm × ${C.h} cm. Un bâton de <b>${C.r} cm</b> peut-il y entrer (en le mettant en diagonale) ?`,`Una caja mide ${C.l} cm × ${C.p} cm × ${C.h} cm. ¿Cabe dentro un palo de <b>${C.r} cm</b> (poniéndolo en diagonal)?`),
    fig:()=>figBox({L:C.l,P:C.p,H:C.h,lL:C.l+' cm',lP:C.p+' cm',lH:C.h+' cm',face:true,space:true,lS:'?',unk:'space'}),opts:[t('Oui, il rentre','Sí, cabe'),t('Non, il ne rentre pas','No, no cabe')],a:C.ok?0:1,
    explain:`<span class="m">d² = ${C.l}² + ${C.p}² + ${C.h}² = ${C.l*C.l+C.p*C.p+C.h*C.h}</span><span class="m">d = √${C.l*C.l+C.p*C.p+C.h*C.h} ${Number.isInteger(d)?'=':'≈'} ${fmt(d)} cm</span><span>${C.ok?t(`${C.r} cm ≤ ${fmt(d)} cm : il rentre.`,`${C.r} cm ≤ ${fmt(d)} cm: cabe.`):t(`${C.r} cm &gt; ${fmt(d)} cm : il ne rentre pas, même en diagonale.`,`${C.r} cm &gt; ${fmt(d)} cm: no cabe, ni en diagonal.`)}</span>`,
    diag:()=>['pasos',t('Pense à la grande diagonale','Piensa en la diagonal del espacio'),t('Le plus long segment dans une boîte va d’un coin du bas au coin opposé du haut.','El segmento más largo dentro de una caja va de una esquina de abajo a la esquina opuesta de arriba.')]});}
function qCube(){const a=pick([3,4,5,6,8,10]),d=a*Math.sqrt(3);
  return {kind:'num',type:'cube',topic:'dist',answer:r1(d),exact:d,round:true,unit:'cm',prompt:t(`Une araignée traverse l’intérieur d’un cube de <b>${a} cm</b> d’arête, d’un coin au coin opposé, en ligne droite. Quelle distance parcourt-elle ? (au dixième)`,`Una araña cruza por dentro un cubo de <b>${a} cm</b> de arista, de una esquina a la opuesta, en línea recta. ¿Qué distancia recorre? (a las décimas)`),
    fig:()=>figBox({L:a,P:a,H:a,lL:a+' cm',lH:a+' cm',lP:a+' cm',face:true,space:true,lS:'?',unk:'space'}),hint:t('Deux étapes : diagonale d’une face, puis grande diagonale.','Dos pasos: diagonal de una cara y después diagonal del cubo.'),
    explain:`<span class="m">${t('face','cara')} : f² = ${a}² + ${a}² = ${2*a*a}</span><span class="m">${t('cube','cubo')} : d² = f² + ${a}² = ${2*a*a} + ${a*a} = ${3*a*a}</span><span class="m">d = √${3*a*a} ≈ ${fmt1(d)} cm</span>`,
    meta:{mode:'cube',diag:(x,N)=>N(a*Math.SQRT2)?['pasos',t('Une étape de plus','Falta un paso'),t('Ça, c’est la diagonale d’une face. L’araignée traverse le cube.','Esa es la diagonal de una cara. La araña cruza el cubo.')]:N(3*a)?['suma',t('Tu as additionné les arêtes','Has sumado aristas'),'']:null}};}
/* ---------- CÍRCULO: TEOREMA DE TALES ---------- */
function qCircle(){const tr=pick(T_EASY.slice(0,5)),[a,b,c]=rnd()<.5?tr:[tr[1],tr[0],tr[2]],th=2*Math.atan2(b,a)/DEG;
  return {kind:'num',type:'circle',topic:'dist',answer:b,prompt:t(`[AB] est un diamètre du cercle et M est un point du cercle. AB = ${c} et AM = ${a}. Calcule MB.`,`[AB] es un diámetro de la circunferencia y M es un punto de ella. AB = ${c} y AM = ${a}. Calcula MB.`),
    fig:()=>figCircle({th,lAB:String(c),lAM:String(a),lMB:'?',unk:'MB'}),hint:t('Un triangle inscrit dans un cercle, dont un côté est un diamètre, est rectangle. Où est l’angle droit ?','Un triángulo inscrito en una circunferencia con un lado que es diámetro es rectángulo. ¿Dónde está el ángulo recto?'),
    explain:`<span>${t('AMB est inscrit dans le cercle de diamètre [AB] : il est rectangle en M (propriété de Thalès).','AMB está inscrito en la circunferencia de diámetro [AB]: es rectángulo en M (teorema de Tales).')}</span><span class="m">MB² = AB² − AM² = ${c*c} − ${a*a} = ${b*b}</span><span class="m">MB = √${b*b} = ${b}</span>`,meta:{mode:'cat',h:c,p:a,x:b}};}
function qCircleWhy(){return mkChoice({type:'circwhy',topic:'dist',prompt:t('M est sur le cercle de diamètre [AB]. Pourquoi le triangle AMB est-il rectangle ?','M está en la circunferencia de diámetro [AB]. ¿Por qué el triángulo AMB es rectángulo?'),fig:()=>figCircle({th:ri(35,145)}),
  opts:[t('Parce qu’un triangle inscrit dans un cercle dont un côté est un diamètre est toujours rectangle (Thalès).','Porque un triángulo inscrito en una circunferencia con un lado que es diámetro siempre es rectángulo (Tales).'),t('Parce que ça se voit sur le dessin.','Porque se ve en el dibujo.'),t('Parce que AM = MB.','Porque AM = MB.')],a:0,
  explain:t('<span>Un dessin peut tromper : on démontre avec une propriété. Thalès de Milet l’aurait démontré il y a plus de 2 500 ans.</span>','<span>Un dibujo puede engañar: se demuestra con una propiedad. Se atribuye a Tales de Mileto, hace más de 2.500 años.</span>'),
  diag:()=>['lectura',t('Un dessin ne prouve rien','Un dibujo no demuestra nada'),t('On doit citer une propriété vraie pour tous les cas.','Hay que usar una propiedad que se cumpla en todos los casos.')]});}

const INTROS={
  c1:{echo:tf('Il y a environ 2 300 ans, Euclide a démontré ce même secret en dessinant des carrés sur les côtés d’un triangle, comme ceux-ci.','Hace unos 2.300 años, Euclides demostró este mismo secreto dibujando cuadrados sobre los lados de un triángulo, como estos.'),story:tf('En entrant dans le temple, tu trouves un sol couvert de carreaux. Quelqu’un a construit un carré sur chaque côté d’un triangle. On dit que ces carrés cachent le secret qui ouvre toutes les portes.','Al entrar en el templo encuentras un suelo de baldosas. Alguien construyó un cuadrado sobre cada lado de un triángulo. Dicen que esos cuadrados esconden el secreto que abre todas las puertas.'),
    rules:()=>[t('Compte, additionne et découvre le secret par toi-même.','Cuenta, suma y descubre el secreto por ti mismo.'),t('Ici, tu ne perds pas d’amulettes : c’est la salle pour apprendre.','Aquí no pierdes amuletos: es la cámara para aprender.'),t('Si tu bloques, un indice coûte 1 torche.','Si te atascas, una pista cuesta 1 antorcha.')]},
  c2:{echo:tf('On raconte que les arpenteurs d’Égypte, les « tendeurs de corde », traçaient des angles droits avec des cordes pleines de nœuds.','Se cuenta que los agrimensores de Egipto, los «tensadores de cuerda», trazaban ángulos rectos con cuerdas llenas de nudos.'),story:tf('Pour avancer, il faut traverser des gouffres. Du haut de chaque falaise, tu lances une corde tendue jusqu’à l’autre bord. Ta torche se consume.','Para avanzar hay que cruzar abismos. Desde lo alto de cada acantilado lanzas una cuerda tensa hasta el otro lado. Tu antorcha se va consumiendo.'),
    rules:()=>[t(`Tu as ${DF().arcade} secondes. Chaque bonne réponse tend un pont.`,`Tienes ${DF().arcade} segundos. Cada acierto tiende un puente.`),t('Les bonnes réponses à la suite multiplient ton XP : ×2, ×3, ×4.','Aciertos seguidos multiplican tu XP: ×2, ×3, ×4.'),t('Une erreur enlève 5 secondes. Lis bien : on ne te demande pas toujours la corde.','Un fallo quita 5 segundos. Lee bien: no siempre te piden la cuerda.')]},
  c3:{echo:tf('Une vieille anecdote raconte que le sage Thalès est tombé dans un puits parce qu’il regardait les étoiles. Toi, regarde bien où tu poses l’échelle.','Una anécdota antigua cuenta que el sabio Tales se cayó a un pozo por ir mirando las estrellas. Tú mira bien dónde pones la escalera.'),story:tf('Le chemin descend dans un puits profond. Il te faut des échelles de la bonne longueur. Maintenant, l’échelle est souvent l’hypoténuse, et il manque un côté de l’angle droit.','El camino baja por un pozo profundo. Necesitas escaleras de la medida justa. Ahora la escalera suele ser la hipotenusa, y lo que falta es un cateto.'),
    rules:()=>[t(`8 missions et ${DF().lives} amulettes. Chaque erreur coûte une amulette.`,`8 misiones y ${DF().lives} amuletos. Cada fallo cuesta un amuleto.`),t('Pour un côté de l’angle droit : hypoténuse² − côté² puis la racine.','Para un cateto: hipotenusa² − cateto² y después la raíz.'),t('Les missions ne demandent pas toutes la même chose.','No todas las misiones piden lo mismo.')]},
  c7:{echo:tf('Hippase de Métaponte aurait découvert que la diagonale d’un carré de côté 1 ne peut pas s’écrire comme une fraction.','Se dice que Hipaso de Metaponto descubrió que la diagonal de un cuadrado de lado 1 no se puede escribir como una fracción.'),story:tf('Une fontaine murmure au fond d’une grotte. Sur sa margelle, des nombres sont gravés sous un signe étrange : √. Pour boire, il faut comprendre ce que veut dire « prendre la racine ».','Una fuente murmura al fondo de una gruta. En su borde hay números grabados bajo un signo extraño: √. Para beber hay que entender qué significa «hacer la raíz».'),
    rules:()=>[t(`9 énigmes et ${DF().lives} amulettes.`,`9 enigmas y ${DF().lives} amuletos.`),t('Carrés parfaits, encadrements, valeurs approchées et nombres irrationnels.','Cuadrados perfectos, entre qué enteros está una raíz, aproximaciones y números irracionales.'),t('Attention au piège : √(a + b) n’est pas √a + √b.','Ojo con la trampa: √(a + b) no es √a + √b.')]},
  c4:{echo:tf('Aristote a écrit les règles pour raisonner sans se tromper. Le scribe tricheur ne les respectait pas.','Aristóteles escribió las reglas para razonar sin equivocarse. El escriba tramposo no las respetaba.'),story:tf('Dans la bibliothèque du temple, il y a des parchemins avec des problèmes. Le scribe qui les a écrits était un tricheur : il a mélangé des données inutiles, changé les unités et caché des questions bizarres.','En la biblioteca del templo hay pergaminos con problemas. El escriba que los escribió era tramposo: mezcló datos que no sirven, cambió unidades y escondió preguntas raras.'),
    rules:()=>[t('D’abord, touche chaque nombre jusqu’à ce qu’il dise ce qu’il est : côté de l’angle droit, hypoténuse ou inutile.','Primero pulsa cada número hasta que diga lo que es: cateto, hipotenusa o no sirve.'),t('Choisis ce que l’on te demande. Alors seulement tu pourras calculer.','Elige qué te piden. Solo entonces podrás calcular.'),t(`Tu as ${DF().lives} amulettes et l’abaque. Arrondis au dixième si besoin.`,`Tienes ${DF().lives} amuletos y el ábaco. Redondea a las décimas cuando haga falta.`)]},
  c8:{echo:tf('Juste après le théorème, Euclide a démontré sa réciproque : si a² + b² = c², alors le triangle est rectangle.','Justo después del teorema, Euclides demostró su recíproco: si a² + b² = c², entonces el triángulo es rectángulo.'),story:tf('Des triangles accusés attendent leur jugement : « Est-il rectangle, oui ou non ? » Ici, on ne croit pas les dessins. On démontre.','Unos triángulos acusados esperan su juicio: «¿Es rectángulo, sí o no?». Aquí no se cree a los dibujos. Se demuestra.'),
    rules:()=>[t(`9 affaires et ${DF().lives} amulettes.`,`9 casos y ${DF().lives} amuletos.`),t('Compare toujours le carré du plus grand côté avec la somme des deux autres.','Compara siempre el cuadrado del lado mayor con la suma de los otros dos.'),t('Dans les rédactions, choisis chaque morceau de phrase. Une seule erreur est pardonnée.','En las redacciones, elige cada trozo de frase. Se perdona un solo error.')]},
  c9:{echo:tf('Hipparque, il y a plus de 2 100 ans, a fabriqué la première table qui relie les angles et les longueurs : le début de la trigonométrie.','Hiparco, hace más de 2.100 años, hizo la primera tabla que relaciona ángulos y longitudes: el comienzo de la trigonometría.'),story:tf('En haut de la tour, un observatoire ouvert sur les étoiles. Les astronomes mesuraient ce qu’ils ne pouvaient pas toucher, rien qu’avec des angles.','En lo alto de la torre hay un observatorio abierto a las estrellas. Los astrónomos medían lo que no podían tocar, solo con ángulos.'),
    rules:()=>[t(`9 observations et ${DF().lives} amulettes. Abaque avec cos et cos⁻¹.`,`9 observaciones y ${DF().lives} amuletos. Ábaco con cos y cos⁻¹.`),t('cos(angle) = côté adjacent ÷ hypoténuse.','cos(ángulo) = cateto contiguo ÷ hipotenusa.'),t('Calcule toujours en degrés et arrondis comme on te le demande.','Calcula siempre en grados y redondea como te pidan.')]},
  c10:{echo:tf('René Descartes, philosophe français, a eu l’idée de repérer chaque point avec deux nombres : ses coordonnées.','René Descartes, filósofo francés, tuvo la idea de localizar cada punto con dos números: sus coordenadas.'),story:tf('Sous le temple, une crypte quadrillée. Des coffres sont posés dans tous les coins, et le chemin le plus court traverse parfois l’espace en diagonale.','Bajo el templo hay una cripta cuadriculada. Hay cofres en todas las esquinas, y el camino más corto a veces cruza el espacio en diagonal.'),
    rules:()=>[t(`9 énigmes et ${DF().lives} amulettes.`,`9 enigmas y ${DF().lives} amuletos.`),t('Dans un repère, dessine le triangle rectangle caché.','En unos ejes, dibuja el triángulo rectángulo escondido.'),t('Dans un pavé, la grande diagonale se trouve en deux étapes.','En un ortoedro, la diagonal del espacio se halla en dos pasos.')]},
  c5:{echo:tf('Selon la tradition, à l’entrée de l’Académie de Platon, il était écrit : « Que nul n’entre ici s’il n’est géomètre ».','Según la tradición, en la entrada de la Academia de Platón ponía: «Que no entre nadie que no sepa geometría».'),story:tf('La porte se referme derrière toi. Quatre sceaux la bloquent et le sable commence à couler.','La puerta se cierra detrás de ti. Cuatro sellos la bloquean y la arena empieza a caer.'),

  c6:{echo:tf('Dans la Chine ancienne, ce secret avait un autre nom : gougu. Le Gardien connaît tous ses noms.','En la antigua China este secreto tenía otro nombre: gougu. El Guardián conoce todos sus nombres.'),story:tf('La statue du Gardien se réveille. Elle ne laissera sortir que celui qui maîtrise tout le théorème.','La estatua del Guardián despierta. Solo dejará salir a quien domine el teorema entero.'),

function expCheck(){
  const e=EXPS.find(x=>x.id===expSel)||EXPS[0];
  const A=parseNum($('#e1').value),B=parseNum($('#e2').value),mine=parseNum($('#e3').value),real=parseNum($('#e4').value),Hh=e.mode==='box'?parseNum($('#e5').value):0;
  let html='',success=false;
  if([A,B,mine].some(isNaN)||A<=0||B<=0||(e.mode==='box'&&(isNaN(Hh)||Hh<=0))){expRes[e.id]=`<p class="mk-msg">${t('Écris les mesures et ton calcul avant de vérifier.','Escribe las medidas y tu cálculo antes de comprobar.')}</p>`;render();return;}
  if(e.mode==='cat'&&A<=B){expRes[e.id]=`<p class="mk-msg">${t('Le balai doit être plus long que la distance de son pied au mur. Revois les mesures.','La escoba tiene que ser más larga que la distancia de su pie a la pared. Revisa las medidas.')}</p>`;render();return;}
  const truth=e.mode==='cat'?Math.sqrt(A*A-B*B):e.mode==='box'?Math.hypot(A,B,Hh):Math.hypot(A,B);
  const calcOk=Math.abs(mine-truth)<=Math.max(0.6,truth*0.01);
  const ex=e.mode==='cat'?explCat(A,B,'cm',true):e.mode==='box'?`<span class="m">d² = ${fmt(A)}² + ${fmt(B)}² + ${fmt(Hh)}² = ${fmt(A*A+B*B+Hh*Hh)}</span><span class="m">d ≈ ${fmt1(truth)} cm</span>`:explHyp(A,B,'cm',true);
  if(!calcOk){const d=e.mode==='box'?['pasos',t('Revois le calcul','Revisa el cálculo'),t('Il faut les trois dimensions au carré.','Hacen falta las tres dimensiones al cuadrado.')]:diagnose({meta:e.mode==='cat'?{mode:'cat',h:A,p:B}:{mode:'hyp',p:A,q:B}},mine);S.stats.err[d[0]]=(S.stats.err[d[0]]||0)+1;sfx('bad');
    html=`<div class="fb bad"><p class="fb-title">${d[1]}</p><p>${d[2]}</p><div class="fb-body"><span class="fb-sub">${t('Voici le calcul','Así se calcula')}</span>${ex}</div></div>`;}
  else{
    html=`<div class="fb ok"><p class="fb-title">${t('Calcul juste','Cálculo correcto')}</p><div class="fb-body">${ex}</div>`;
    if(!isNaN(real)&&real>0){const diff=Math.abs(real-truth)/truth*100;
      if(diff<=5){success=true;html+=`<p>${t(`Tu as mesuré ${fmt(real)} cm : un écart de ${fmt(diff)} %. La réalité confirme Pythagore.`,`Mediste ${fmt(real)} cm: una diferencia del ${fmt(diff)} %. La realidad confirma a Pitágoras.`)}</p>`;}
      else html+=`<p>${t(`Tu as mesuré ${fmt(real)} cm, soit ${Math.round(diff)} % d’écart. Revois les mesures : as-tu mesuré exactement d’un bord à l’autre ?`,`Mediste ${fmt(real)} cm, un ${Math.round(diff)} % distinto. Repasa las medidas: ¿mediste de borde a borde exacto?`)}</p>`;}
    else html+=`<p>${t(`Maintenant mesure ${T(e.lc)} en vrai et écris-la pour terminer l’expédition.`,`Ahora mide ${T(e.lc)} de verdad y escríbela para cerrar la expedición.`)}</p>`;
    if(e.bonus)html+=`<p class="small">${t(`${fmt(truth)} cm font ${fmt(truth/2.54)} pouces (1 pouce = 2,54 cm). C’est comme ça qu’on annonce les écrans.`,`${fmt(truth)} cm son ${fmt(truth/2.54)} pulgadas (1 pulgada = 2,54 cm). Así se anuncian las pantallas.`)}</p>`;
    html+='</div>';sfx('ok');
  }
  const first=!(S.exp[e.id]&&S.exp[e.id].done);
  S.exp[e.id]={done:success||!first,v:[A,B,mine,real,Hh]};
  if(success&&first){gainXP(40);html+=`<p class="xpgain">+${Math.round(40*DF().xp)} XP</p>`;confetti(80);say(t('Expédition terminée. La réalité confirme Pythagore.','Expedición completada. La realidad confirma a Pitágoras.'));}
  save();expRes[e.id]=html;render();
  if(success&&first&&EXPS.filter(x=>S.exp[x.id]&&S.exp[x.id].done).length>=3)grant('medidor');
}
