/* =========================================================
   ÁBACO (calculadora con √, x², cos y cos⁻¹ en grados)
   ========================================================= */
function calcHTML(){const K=(k,l,c)=>`<button class="btn${c?' '+c:''}" data-act="calcKey" data-k="${k}"${k==='⌫'?` aria-label="${t('Effacer','Borrar')}"`:''}>${l||k}</button>`;
  return `<div class="calc-head"><span>${t('Abaque du temple','Ábaco del templo')}</span><button class="btn tiny ghost" data-act="calc" aria-label="${t('Fermer l’abaque','Cerrar el ábaco')}">×</button></div>
  <label for="calcIn" class="sr">${t('Opération','Operación')}</label><input id="calcIn" class="calc-in" autocomplete="off" placeholder="√(9+16)"><div class="calc-out" id="calcOut"></div>
  <div class="calc-keys">${K('√')}${K('²','x²')}${K('cos')}${K('acos','cos⁻¹')}${K('C')}${K('7')}${K('8')}${K('9')}${K('÷')}${K('⌫')}${K('4')}${K('5')}${K('6')}${K('×')}${K('−')}${K('1')}${K('2')}${K('3')}${K('+')}${K(',')}${K('0','0','k1')}${K('(')}${K(')')}${K('=','=','primary k2')}</div>
  <p class="calc-deg small">${t('Angles en degrés','Ángulos en grados')}</p><button class="btn tiny" data-act="calcUse">${t('Copier le résultat dans ma réponse','Copiar el resultado a mi respuesta')}</button>`;}
let calcLast=null;
function toggleCalc(force){const c=$('#calc');const show=typeof force==='boolean'?force:c.hidden;if(show&&!c.innerHTML.trim())c.innerHTML=calcHTML();c.hidden=!show;if(show){sfx('click');if(!TOUCH)$('#calcIn').focus();}}
function calcEval(src){
  const s=src.replace(/\s+/g,'').replace(/,/g,'.').replace(/cos⁻¹|arccos|acos/gi,'A').replace(/cos/gi,'K').replace(/[×xX*]/g,'*').replace(/[÷/:]/g,'/').replace(/[−–]/g,'-').replace(/sqrt|racine|raiz|raíz/gi,'√').replace(/\^2/g,'²');
  let i=0;const at=()=>s[i];
  function expr(){let v=term();for(;;){if(at()==='+'){i++;v+=term();}else if(at()==='-'){i++;v-=term();}else return v;}}
  function term(){let v=factor();for(;;){const c=at();if(c==='*'){i++;v*=factor();}else if(c==='/'){i++;v/=factor();}else if(c==='('||c==='√'||c==='K'||c==='A'||(c&&/[\d.]/.test(c))){v*=factor();}else return v;}}
  function factor(){if(at()==='-'){i++;return -factor();}if(at()==='+'){i++;return factor();}if(at()==='√'){i++;return Math.sqrt(factor());}if(at()==='K'){i++;return cosd(factor());}if(at()==='A'){i++;const x=factor();if(x<-1||x>1)throw new Error('dom');return acosd(x);}let v=prim();while(at()==='²'||at()==='^'){if(at()==='²'){i++;v=v*v;}else{i++;v=Math.pow(v,factor());}}return v;}
  function prim(){if(at()==='('){i++;const v=expr();if(at()===')')i++;return v;}const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw new Error('x');i+=m[0].length;return parseFloat(m[0]);}
  if(!s)throw new Error('empty');const v=expr();if(i<s.length)throw new Error('rest');return v;
}
function calcKey(k){
  const inp=$('#calcIn'),out=$('#calcOut');sfx('click');
  if(k==='C'){inp.value='';out.textContent='';calcLast=null;}
  else if(k==='⌫'){inp.value=inp.value.slice(0,-1);}
  else if(k==='='){try{const v=calcEval(inp.value);if(!isFinite(v))throw 0;calcLast=v;out.textContent='= '+(Math.round(v*10000)/10000).toString().replace('.',',');}catch(e){calcLast=null;out.textContent=t('Vérifie l’opération','Revisa la operación');}}
  else inp.value+=(k==='√'?'√(':k==='cos'?'cos(':k==='acos'?'cos⁻¹(':k);
  if(!TOUCH)inp.focus();
}
function calcUse(){if(calcLast==null)calcKey('=');const a=$('#ans');if(calcLast!=null&&a&&!a.disabled){a.value=(Math.round(calcLast*100)/100).toString().replace('.',',');a.focus();}}

  {id:'india',name:S3('Baudhayana et les Sulba Sutras','Baudhāyana y los Sulba Sutras'),when:S3('vers 800 – 500 av. J.-C. (dates incertaines)','c. 800 – 500 a.C. (fechas inciertas)'),where:S3('Inde ancienne','India antigua'),at:'c5',g:'M3 19h18M5 19v-4h14v4M7 15v-4h10v4M9 11V7h6v4',
   story:S3('Dans l’Inde ancienne, on construisait des autels en briques avec des formes et des tailles exactes pour les cérémonies. Les règles pour les tracer ont été écrites dans les Sulba Sutras, les « manuels de la corde ». Le plus ancien que nous connaissons est celui de Baudhayana.','En la India antigua se construían altares de ladrillo con formas y tamaños exactos para las ceremonias. Las reglas para trazarlos se escribieron en los Sulba Sutras, los «manuales de la cuerda». El más antiguo que conocemos es el de Baudhāyana.'),
   link:S3('Il dit, avec d’autres mots, que la corde tendue sur la diagonale d’un rectangle « produit » autant de surface que celles du grand côté et du petit côté réunies. C’est le théorème ! Et il a probablement été écrit avant la naissance de Pythagore.','Dice, con otras palabras, que la cuerda tendida en la diagonal de un rectángulo «produce» tanta superficie como las que producen el lado largo y el corto juntas. ¡Es el teorema! Y probablemente se escribió antes de que naciera Pitágoras.'),
   cur:S3('Ils donnaient aussi une très bonne approximation de √2 : 1 + 1/3 + 1/(3·4) − 1/(3·4·34), soit 1,4142157.','También daban una aproximación de √2 muy buena: 1 + 1/3 + 1/(3·4) − 1/(3·4·34), que da 1,4142157.'),
   q:S3('À quoi servait la géométrie des Sulba Sutras ?','¿Para qué usaban la geometría los Sulba Sutras?'),opts:[S3('À naviguer en mer','Para navegar por el mar'),S3('À construire des autels','Para construir altares'),S3('À fabriquer des pièces de monnaie','Para fabricar monedas')],a:1},
  {id:'tales',name:S3('Thalès de Milet','Tales de Mileto'),who:'tales',when:S3('vers 624 – 546 av. J.-C.','c. 624 – 546 a.C.'),where:S3('Milet (Turquie actuelle)','Mileto (actual Turquía)'),at:'c3',g:'M2 20h20M5 20l6-10 6 10M15 20l6-3M17 5a2 2 0 1 0 4 0a2 2 0 1 0-4 0',
   story:S3('On le considère comme le premier philosophe et mathématicien grec. On raconte qu’en Égypte il a calculé la hauteur d’une pyramide sans y monter : il a attendu le moment où l’ombre d’un bâton mesurait autant que le bâton. À cet instant, l’ombre de la pyramide mesurait aussi autant que sa hauteur. D’après l’historien Hérodote, il aurait même prédit une éclipse de Soleil.','Se le considera el primer filósofo y matemático griego. Se cuenta que, en Egipto, calculó la altura de una pirámide sin subirse a ella: esperó al momento del día en que la sombra de un bastón medía lo mismo que el bastón. En ese instante, la sombra de la pirámide también medía lo mismo que su altura. Según el historiador Heródoto, incluso predijo un eclipse de Sol.'),
   link:S3('Une propriété qui porte son nom dit que si on relie les extrémités d’un diamètre à n’importe quel point du cercle, on obtient toujours un angle droit. Tu l’utilises dans la Crypte des Distances.','Un teorema suyo dice que si unes los extremos de un diámetro con cualquier punto de la circunferencia, siempre sale un ángulo recto. Lo usas en la Cripta de las Distancias.'),
   cur:S3('Une anecdote raconte qu’il est tombé dans un puits parce qu’il regardait les étoiles.','Una anécdota cuenta que se cayó a un pozo por ir mirando las estrellas.'),
   q:S3('Comment Thalès a-t-il mesuré la hauteur d’une pyramide ?','¿Cómo midió Tales la altura de una pirámide?'),opts:[S3('En montant avec une corde','Subiendo con una cuerda'),S3('En comptant les blocs','Contando los bloques'),S3('Avec son ombre','Con su sombra')],a:2},
  {id:'pitagoras',name:S3('Pythagore de Samos','Pitágoras de Samos'),who:'pitagoras',when:S3('vers 570 – 495 av. J.-C.','c. 570 – 495 a.C.'),where:S3('Samos (Grèce) et Crotone (sud de l’Italie)','Samos (Grecia) y Crotona (sur de Italia)'),at:'start',g:'M6 18V8l10 10zM6 8V4h4M16 18h4v-4M6 14h4v4',
   story:S3('Il est né sur l’île de Samos et, dit-on, il a voyagé en Égypte et à Babylone pour apprendre auprès de leurs sages. À Crotone, il a fondé une école très spéciale : ses élèves, les pythagoriciens, vivaient en communauté, suivaient des règles strictes et gardaient secret ce qu’ils découvraient. Ils croyaient que « tout est nombre » et ont découvert que les notes de musique qui sonnent bien ensemble dépendent de rapports simples entre les cordes. Pythagore n’a rien écrit : ce qu’on sait de lui, d’autres l’ont raconté bien plus tard.','Nació en la isla de Samos y, según se cuenta, viajó a Egipto y a Babilonia para aprender de sus sabios. En Crotona fundó una escuela muy especial: sus alumnos, los pitagóricos, vivían en comunidad, seguían reglas estrictas y guardaban en secreto lo que descubrían. Creían que «todo es número» y descubrieron que las notas musicales que suenan bien juntas dependen de proporciones sencillas entre las cuerdas. Pitágoras no dejó nada escrito: lo que sabemos de él lo contaron otros, mucho después.'),
   link:S3('Le théorème porte son nom, même si les Babyloniens et les Indiens connaissaient déjà la règle. Ce qu’on attribue à son école, c’est de l’avoir démontré : expliquer pourquoi il est toujours vrai, dans tous les triangles rectangles.','El teorema lleva su nombre, aunque babilonios e indios ya conocían la regla. Lo que se atribuye a su escuela es haberlo demostrado: explicar por qué se cumple siempre, en todos los triángulos rectángulos.'),
   cur:S3('Une des règles des pythagoriciens interdisait de manger des fèves. Personne ne sait vraiment pourquoi.','Una de las normas de los pitagóricos prohibía comer habas. Nadie sabe muy bien por qué.'),
   q:S3('Que croyaient les pythagoriciens ?','¿Qué creían los pitagóricos?'),opts:[S3('Que tout est nombre','Que todo es número'),S3('Que la Terre est plate','Que la Tierra es plana'),S3('Que le feu est l’origine de tout','Que el fuego es el origen de todo')],a:0},
  {id:'teano',name:S3('Théano','Teano'),who:'teano',when:S3('VIe siècle av. J.-C.','Siglo VI a.C.'),where:S3('Crotone (sud de l’Italie)','Crotona (sur de Italia)'),at:'start',g:circ(12,8,4)+'M6 21c0-5 3-8 6-8s6 3 6 8',
   story:S3('Théano faisait partie de l’école de Pythagore, qui acceptait des femmes, chose rare à l’époque. Selon la tradition, elle fut son élève et son épouse, et elle aurait dirigé l’école après lui. Les sources anciennes ne sont pas d’accord sur sa vie, et plusieurs textes qu’on lui attribue ont été écrits des siècles plus tard.','Teano formaba parte de la escuela de Pitágoras, que admitía mujeres, algo poco común en su época. Según la tradición, fue su alumna y su esposa, y habría dirigido la escuela después de él. Las fuentes antiguas no se ponen de acuerdo sobre su vida, y varios textos que se le atribuyen se escribieron siglos después.'),
   link:S3('Dans ce jeu, elle est ta guide : comme les pythagoriciens, elle préfère que tu découvres le théorème toi-même plutôt que de l’apprendre par cœur.','En este juego es tu guía: como los pitagóricos, prefiere que descubras el teorema tú mismo en vez de aprenderlo de memoria.'),
   cur:S3('On lui attribue une phrase sur le nombre : les choses ne sont pas faites de nombres, mais elles suivent l’ordre des nombres.','Se le atribuye una idea sobre los números: las cosas no están hechas de números, sino que siguen el orden de los números.'),
   q:S3('Qu’avait de spécial l’école de Pythagore ?','¿Qué tenía de especial la escuela de Pitágoras?'),opts:[S3('Elle acceptait aussi des femmes','También admitía mujeres'),S3('Elle était sous la mer','Estaba bajo el mar'),S3('On y apprenait à naviguer','Allí se aprendía a navegar')],a:0},
  {id:'hipaso',name:S3('Hippase de Métaponte','Hipaso de Metaponto'),who:'hipaso',when:S3('Ve siècle av. J.-C.','Siglo V a.C.'),where:S3('Sud de l’Italie','Sur de Italia'),at:'c7',g:'M5 5h14v14H5zM5 19L19 5',
   story:S3('C’était un pythagoricien. Les pythagoriciens croyaient que n’importe quelle mesure pouvait s’écrire comme une fraction de nombres entiers. Mais si on calcule avec leur propre théorème la diagonale d’un carré de côté 1, on obtient √2, et on a démontré que √2 n’est aucune fraction : ses décimales continuent pour toujours sans se répéter. C’était un nombre « irrationnel ».','Fue un pitagórico. Los pitagóricos creían que cualquier medida se podía escribir como una fracción de números enteros. Pero si calculas con su propio teorema la diagonal de un cuadrado de lado 1, sale √2, y se demostró que √2 no es ninguna fracción: sus decimales siguen para siempre sin repetirse. Era un número «irracional».'),
   link:S3('Diagonale d’un carré de côté 1 : d² = 1² + 1² = 2, donc d = √2 ≈ 1,4142… Le théorème a mené les pythagoriciens à un nombre qu’ils n’attendaient pas.','Diagonal de un cuadrado de lado 1: d² = 1² + 1² = 2, así que d = √2 ≈ 1,4142… El teorema llevó a los pitagóricos a un número que no esperaban.'),
   cur:S3('La légende raconte qu’Hippase a révélé le secret hors de l’école et qu’il a disparu dans un naufrage. C’est sûrement une légende, mais elle montre à quel point la découverte les a impressionnés.','La leyenda cuenta que Hipaso reveló el secreto fuera de la escuela y desapareció en un naufragio. Seguramente es solo una leyenda, pero muestra cuánto les impresionó el descubrimiento.'),
   q:S3('Quel nombre ont-ils découvert impossible à écrire en fraction ?','¿Qué número descubrieron que no se puede escribir como fracción?'),opts:[S3('La moitié','La mitad'),'√2','25'],a:1},
  {id:'socrates',name:S3('Socrate','Sócrates'),who:'socrates',when:S3('vers 470 – 399 av. J.-C.','c. 470 – 399 a.C.'),where:S3('Athènes','Atenas'),at:'c8',g:'M12 3a5 5 0 1 0 0 10a5 5 0 1 0 0-10zM9 9h.01M15 9h.01M7 21c1-4 3-6 5-6s4 2 5 6M10 17l2 2 2-2',
   story:S3('Socrate n’a jamais rien écrit, et pourtant c’est l’un des philosophes les plus célèbres. Il se promenait dans Athènes en posant des questions à tout le monde : « Qu’est-ce que le courage ? Qu’est-ce que la justice ? » Il disait que sa méthode ressemblait au métier de sa mère, sage-femme : il aidait les autres à « accoucher » de leurs propres idées.','Sócrates nunca escribió nada y, sin embargo, es uno de los filósofos más famosos. Paseaba por Atenas haciendo preguntas a todo el mundo: «¿Qué es el valor? ¿Qué es la justicia?». Decía que su método se parecía al oficio de su madre, que era partera: ayudaba a los demás a «dar a luz» sus propias ideas.'),
   link:S3('Dans le livre Ménon, écrit par Platon, Socrate aide un jeune esclave à construire un carré deux fois plus grand qu’un autre, rien qu’avec des questions. La clé : prendre la diagonale du premier carré comme côté du nouveau. C’est exactement ce que dit le théorème : d² = c² + c² = 2c².','En el libro Menón, escrito por Platón, Sócrates ayuda a un joven esclavo a construir un cuadrado con el doble de área que otro, solo con preguntas. La clave: usar la diagonal del primer cuadrado como lado del nuevo. Es justo lo que dice el teorema: d² = l² + l² = 2l².'),
   cur:S3('On lui attribue la phrase : « Je sais que je ne sais rien. »','Se le atribuye la frase: «Solo sé que no sé nada».'),
   q:S3('Comment Socrate enseignait-il ?','¿Cómo enseñaba Sócrates?'),opts:[S3('En posant des questions','Haciendo preguntas'),S3('En écrivant des livres','Escribiendo libros'),S3('En faisant des examens','Poniendo exámenes')],a:0},
  {id:'platon',name:S3('Platon','Platón'),who:'platon',when:S3('vers 427 – 347 av. J.-C.','c. 427 – 347 a.C.'),where:S3('Athènes','Atenas'),at:'c5',g:'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5',
   story:S3('Élève de Socrate, il a fondé à Athènes l’Académie, une école qui a fonctionné pendant des siècles. Selon la tradition, à son entrée il était écrit : « Que nul n’entre ici s’il n’est géomètre. » Il pensait que les mathématiques entraînent l’esprit à bien raisonner.','Fue alumno de Sócrates y fundó en Atenas la Academia, una escuela que funcionó durante siglos. Según la tradición, en su entrada había un aviso: «Que no entre nadie que no sepa geometría». Pensaba que las matemáticas entrenan la mente para razonar bien.'),
   link:S3('Dans son livre Timée, il imagine que toute la matière est construite avec deux sortes de triangles rectangles : le demi-carré et le demi-triangle équilatéral.','En su libro Timeo imagina que toda la materia está construida con dos tipos de triángulos rectángulos: el medio cuadrado y el medio triángulo equilátero.'),
   cur:S3('Les cinq « solides de Platon » portent son nom. Les dés de jeux de rôle à 4, 6, 8, 12 et 20 faces ont ces formes.','Los cinco «sólidos platónicos» llevan su nombre. Los dados de rol de 4, 6, 8, 12 y 20 caras tienen esas formas.'),
   q:S3('Que disait l’inscription à l’entrée de l’Académie ?','¿Qué decía el aviso de la entrada de la Academia?'),opts:[S3('Interdit de parler fort','Prohibido hablar alto'),S3('Que nul n’entre ici s’il n’est géomètre','Que no entre nadie que no sepa geometría'),S3('Réservé aux athlètes','Solo para atletas')],a:1},
  {id:'aristoteles',name:S3('Aristote','Aristóteles'),who:'aristoteles',when:S3('384 – 322 av. J.-C.','384 – 322 a.C.'),where:S3('Stagire (Macédoine) et Athènes','Estagira (Macedonia) y Atenas'),at:'c4',g:circ(6,6,2)+circ(18,6,2)+circ(12,19,2)+'M7 8l4 9M17 8l-4 9M8 6h8',
   story:S3('Il a étudié une vingtaine d’années à l’Académie de Platon, puis il a été le maître du jeune Alexandre le Grand. Il a fondé sa propre école, le Lycée, où l’on dit qu’il enseignait en marchant. Il a écrit sur presque tout : animaux, plantes, physique, politique, poésie… et surtout la logique : les règles pour raisonner sans se tromper.','Estudió unos veinte años en la Academia de Platón y después fue maestro del joven Alejandro Magno. Fundó su propia escuela, el Liceo, donde se dice que enseñaba paseando. Escribió sobre casi todo: animales, plantas, física, política, poesía… y sobre todo, lógica: las reglas para razonar sin equivocarse.'),
   link:S3('Dans ses écrits de logique, il prend comme exemple une démonstration célèbre : la diagonale d’un carré ne peut pas se mesurer avec la même unité que le côté, car sinon un même nombre devrait être pair et impair à la fois. Et c’est impossible.','En sus escritos de lógica pone como ejemplo una demostración famosa: la diagonal de un cuadrado no se puede medir con la misma unidad que el lado, porque si se pudiera, un mismo número tendría que ser par e impar a la vez. Y eso es imposible.'),
   cur:S3('Il a observé et décrit des centaines d’animaux. Pendant près de deux mille ans, ses livres ont été la référence dans beaucoup de sciences.','Observó y describió cientos de animales. Durante casi dos mil años sus libros fueron la referencia en muchas ciencias.'),
   q:S3('De qui Aristote a-t-il été le maître ?','¿De quién fue maestro Aristóteles?'),opts:[S3('De Pythagore','De Pitágoras'),S3('D’Alexandre le Grand','De Alejandro Magno'),S3('De Jules César','De Julio César')],a:1},
  {id:'euclides',name:S3('Euclide d’Alexandrie','Euclides de Alejandría'),who:'euclides',when:S3('vers 300 av. J.-C.','c. 300 a.C.'),where:S3('Alexandrie (Égypte)','Alejandría (Egipto)'),at:'c1',g:P.book,
   story:S3('Il a travaillé à Alexandrie, la ville de la célèbre Bibliothèque. Il a écrit les Éléments : treize livres qui organisent la géométrie connue, en partant de quelques vérités simples et en démontrant tout le reste étape par étape. C’est l’un des livres de mathématiques les plus utilisés de l’histoire : on l’a étudié pendant plus de deux mille ans.','Trabajó en Alejandría, la ciudad de la famosa Biblioteca. Escribió los Elementos: trece libros que ordenan la geometría conocida, empezando por unas pocas verdades sencillas y demostrando todo lo demás paso a paso. Es uno de los libros de matemáticas más usados de la historia: se estudió durante más de dos mil años.'),
   link:S3('La proposition 47 de son premier livre est le théorème de Pythagore, démontré avec des carrés construits sur les côtés, comme ceux de la Salle des Carrés. La 48 démontre la réciproque : si a² + b² = c², le triangle est rectangle.','La proposición 47 de su primer libro es el teorema de Pitágoras, demostrado con cuadrados construidos sobre los lados, como los de la Cámara de los Cuadrados. La 48 demuestra el recíproco: si a² + b² = c², el triángulo es rectángulo.'),
   cur:S3('Une anecdote raconte que le roi Ptolémée lui a demandé un chemin plus facile pour apprendre la géométrie, et qu’Euclide a répondu : « Il n’y a pas de voie royale vers la géométrie ».','Cuenta una anécdota que el rey Ptolomeo le pidió un camino más fácil para aprender geometría, y Euclides contestó: «No hay camino real hacia la geometría».'),
   q:S3('Comment s’appelle la grande œuvre d’Euclide ?','¿Cómo se llama la gran obra de Euclides?'),opts:[S3('L’Odyssée','La Odisea'),S3('Les Éléments','Los Elementos'),S3('Le Codex de Samos','El Códice de Samos')],a:1},
  {id:'arquimedes',name:S3('Archimède de Syracuse','Arquímedes de Siracusa'),when:S3('vers 287 – 212 av. J.-C.','c. 287 – 212 a.C.'),where:S3('Syracuse (Sicile)','Siracusa (Sicilia)'),at:'c2',g:'M2 18h20M12 18l-3-5h6zM3 9l18 4M4 5h3v3H4z',
   story:S3('Mathématicien et inventeur. On raconte qu’en entrant dans son bain il a compris comment vérifier si une couronne était en or pur, et qu’il est sorti en criant « Eurêka ! », qui veut dire « J’ai trouvé ! ». Il a étudié les leviers et conçu des machines pour défendre sa ville.','Matemático e inventor. Se cuenta que, al meterse en la bañera, entendió cómo comprobar si una corona era de oro puro y salió gritando «¡Eureka!», que significa «¡Lo encontré!». Estudió las palancas y diseñó máquinas para defender su ciudad.'),
   link:S3('Pour calculer le nombre π, il a dessiné des polygones jusqu’à 96 côtés dedans et dehors un cercle. Pour mesurer leurs côtés, il lui fallait des triangles rectangles et des racines carrées : Pythagore. Il a ainsi montré que π est entre 3,1408 et 3,1429.','Para calcular el número π dibujó polígonos de hasta 96 lados dentro y fuera de un círculo. Para medir sus lados necesitaba triángulos rectángulos y raíces cuadradas, es decir, Pitágoras. Así demostró que π está entre 3,1408 y 3,1429.'),
   cur:S3('On lui attribue la phrase : « Donnez-moi un point d’appui et je soulèverai le monde. »','Se le atribuye la frase «Dadme un punto de apoyo y moveré el mundo».'),
   q:S3('Qu’a crié Archimède en sortant du bain ?','¿Qué gritó Arquímedes al salir de la bañera?'),opts:[S3('Eurêka !','¡Eureka!'),S3('Terre en vue !','¡Tierra a la vista!'),S3('Pythagore !','¡Pitágoras!')],a:0},
  {id:'hiparco',name:S3('Hipparque de Nicée','Hiparco de Nicea'),who:'hiparco',when:S3('vers 190 – 120 av. J.-C.','c. 190 – 120 a.C.'),where:S3('Nicée (Turquie actuelle) et Rhodes','Nicea (actual Turquía) y Rodas'),at:'c9',g:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 3v18M3 12h18M12 12l6-6',
   story:S3('Grand astronome grec, il a travaillé surtout sur l’île de Rhodes. Il a dressé un catalogue de centaines d’étoiles avec leur position et leur éclat, et il a découvert que l’axe de la Terre bouge très lentement (la précession). Beaucoup le considèrent comme le père de la trigonométrie.','Gran astrónomo griego, trabajó sobre todo en la isla de Rodas. Hizo un catálogo de cientos de estrellas con su posición y su brillo, y descubrió que el eje de la Tierra se mueve muy despacio (la precesión). Muchos lo consideran el padre de la trigonometría.'),
   link:S3('Il a calculé une table de « cordes » : pour chaque angle, la longueur du segment qui le sous-tend dans un cercle. Pour la construire, il lui fallait des triangles rectangles… et le théorème de Pythagore. Le cosinus est l’héritier de ces tables.','Calculó una tabla de «cuerdas»: para cada ángulo, la longitud del segmento que lo abarca en un círculo. Para construirla necesitaba triángulos rectángulos… y el teorema de Pitágoras. El coseno es heredero de esas tablas.'),
   cur:S3('Sa table de cordes est perdue : nous la connaissons grâce à Ptolémée, qui l’a reprise trois siècles plus tard.','Su tabla de cuerdas se ha perdido: la conocemos gracias a Ptolomeo, que la retomó tres siglos después.'),
   q:S3('De quelle science Hipparque est-il considéré comme le père ?','¿De qué ciencia se considera padre a Hiparco?'),opts:[S3('La trigonométrie','La trigonometría'),S3('La chimie','La química'),S3('La musique','La música')],a:0},
  {id:'china',name:S3('Le Zhoubi Suanjing','El Zhoubi Suanjing'),when:S3('Compilé il y a environ 2 000 ans','Recopilado hace unos 2.000 años'),where:S3('Chine','China'),at:'c6',g:'M4 4h16v16H4zM4 11L13 4l7 9-9 7z',
   story:S3('C’est l’un des plus anciens livres de mathématiques et d’astronomie de Chine. Pour étudier le mouvement du Soleil, il utilisait un gnomon, un bâton vertical, et mesurait son ombre.','Es uno de los libros de matemáticas y astronomía más antiguos de China. Para estudiar el movimiento del Sol usaba un gnomon, un palo vertical, y medía su sombra.'),
   link:S3('En Chine, le théorème s’appelait « gougu » : gou est le petit côté de l’angle droit et gu le grand. Dès les premières pages apparaît le triangle 3, 4, 5, et un commentateur plus tardif, Zhao Shuang, a ajouté un dessin qui le démontre avec des carrés et des triangles.','En China el teorema se llamaba «gougu»: gou es el cateto corto y gu el largo. En sus primeras páginas aparece el triángulo de lados 3, 4 y 5, y un comentarista posterior, Zhao Shuang, añadió un dibujo que lo demuestra con cuadrados y triángulos.'),
   cur:S3('Gou veut dire à peu près « crochet » et gu « cuisse ».','Gou significa algo así como «gancho» y gu, «muslo».'),
   q:S3('Comment s’appelait le théorème dans la Chine ancienne ?','¿Cómo se llamaba el teorema en la antigua China?'),opts:[S3('Eurêka','Eureka'),S3('Gougu','Gougu'),S3('Hypoténuse','Hipotenusa')],a:1},
  {id:'hipatia',name:S3('Hypatie d’Alexandrie','Hipatia de Alejandría'),who:'hipatia',when:S3('IVe siècle – 415','Siglo IV – 415 d.C.'),where:S3('Alexandrie (Égypte)','Alejandría (Egipto)'),at:'c6',g:circ(12,12,8)+'M12 4v16M4 12h16M7 7l10 10',

/* =========================================================
   ESCENAS CON PERSONAJES Y DILEMAS FILOSÓFICOS
   Línea: {w:quién, m:ánimo, t:tf(fr,es)} · {bg:'fondo'} · {dil:'id'}
   {N} = nombre del jugador (siempre como vocativo «, {N}» para que la voz grabada lo pueda omitir)
   ========================================================= */
const L_=(w,m,fr,es)=>({w,m,t:tf(fr,es)});
const DILEMMAS=[
  {id:'d1',q:tf('Les nombres, on les invente ou on les découvre ?','¿Los números se inventan o se descubren?'),opts:[
    {t:tf('On les découvre : ils étaient là avant nous.','Se descubren: ya estaban ahí antes que nosotros.'),r:L_('pitagoras','happy','C’est ce que je crois ! Le 3, le 4 et le 5 formaient un triangle rectangle bien avant que quelqu’un naisse pour les compter.','¡Eso creo yo! El 3, el 4 y el 5 encajaban en un triángulo rectángulo mucho antes de que naciera nadie para contarlos.')},
    {t:tf('On les invente : ce sont les humains qui les créent pour compter.','Se inventan: los creamos las personas para contar.'),r:L_('teano','neutral','Intéressant. Les noms et les symboles, oui, on les invente : les Romains écrivaient V et nous écrivons 5. Mais les règles qu’ils suivent, qui les a inventées ?','Interesante. Los nombres y los símbolos sí los inventamos: los romanos escribían V y nosotros 5. Pero las reglas que cumplen, ¿quién las inventó?')},
    {t:tf('Un peu des deux.','Un poco las dos cosas.'),r:L_('pitagoras','neutral','Peut-être as-tu raison : on invente les mots pour en parler, et on découvre ce qu’ils font. Les philosophes en discutent depuis 2 500 ans.','Quizá tengas razón: inventamos las palabras para hablar de ellos y descubrimos lo que hacen. Los filósofos llevan 2.500 años discutiéndolo.')}]},
  {id:'d2',q:tf('Si le secret marche sur 3 triangles, est-il démontré ?','Si el secreto funciona en 3 triángulos, ¿ya está demostrado?'),best:1,opts:[
    {t:tf('Oui, trois exemples suffisent.','Sí, tres ejemplos bastan.'),r:L_('pitagoras','neutral','Trois jours de soleil ne prouvent pas qu’il ne pleuvra pas demain. Il nous faut quelque chose de plus solide que des exemples.','Tres días de sol no demuestran que mañana no vaya a llover. Necesitamos algo más fuerte que los ejemplos.')},
    {t:tf('Non : il pourrait rater sur un autre triangle.','No: podría fallar en otro triángulo.'),r:L_('pitagoras','happy','Exactement ! C’est pour ça que les mathématiciens démontrent : un raisonnement valable pour tous les triangles rectangles, sans exception.','¡Exacto! Por eso los matemáticos demuestran: un razonamiento que vale para todos los triángulos rectángulos, sin excepción.')},
    {t:tf('Oui, si les triangles sont très différents.','Sí, si los triángulos son muy distintos.'),r:L_('teano','neutral','Ça aide, mais ça ne suffit pas : il pourrait toujours y en avoir un bizarre qu’on n’a pas essayé. Il faut une démonstration.','Ayuda, pero no basta: siempre podría haber uno raro que no hemos probado. Hace falta una demostración.')}]},
  {id:'d3',q:tf('À quoi sert le plus la géométrie ?','¿Para qué sirve más la geometría?'),opts:[
    {t:tf('À construire : des champs, des pyramides, des maisons.','Para construir: campos, pirámides, casas.'),r:L_('arpedonapta','happy','C’est ce que je dis ! Sans géométrie, chaque crue du Nil finirait en dispute entre voisins.','¡Eso digo yo! Sin geometría, cada crecida del Nilo acabaría en una pelea entre vecinos.')},
    {t:tf('À mieux penser.','Para pensar mejor.'),r:L_('teano','neutral','C’est ce que diraient les Grecs : Platon pensait que la géométrie entraîne l’esprit à raisonner.','Eso dirían los griegos: Platón creía que la geometría entrena la mente para razonar.')},
    {t:tf('Aux deux.','Para las dos cosas.'),r:L_('teano','happy','Les Égyptiens s’en servaient pour mesurer, les Grecs pour démontrer… et aujourd’hui elle sert partout, des ponts aux jeux vidéo.','Los egipcios la usaban para medir, los griegos para demostrar… y hoy se usa para todo, desde los puentes hasta los videojuegos.')}]},
  {id:'d4',q:tf('La servante avait-elle raison de se moquer de Thalès ?','¿Tenía razón la sirvienta al reírse de Tales?'),opts:[
    {t:tf('Oui : il faut regarder où on met les pieds.','Sí: hay que mirar dónde pisas.'),r:L_('tales','neutral','Elle a un peu raison… mais si personne ne regardait les étoiles, personne n’aurait prévu une éclipse. On dit que moi, je l’ai fait.','Tiene su parte de razón… pero si nadie mirara las estrellas, nadie habría predicho un eclipse. Dicen que yo lo hice.')},
    {t:tf('Non : sans rêveurs, pas de découvertes.','No: sin soñadores no hay descubrimientos.'),r:L_('tales','happy','Aristote raconte que, pour prouver que la philosophie sert à quelque chose, j’ai prévu une grosse récolte d’olives et loué tous les pressoirs. Je suis devenu riche !','Aristóteles cuenta que, para demostrar que la filosofía sirve, adiviné una gran cosecha de aceitunas y alquilé todas las prensas. ¡Me hice rico!')},
    {t:tf('Il faut faire les deux.','Hay que hacer las dos cosas.'),r:L_('teano','happy','Regarder loin et regarder près. Dans ce puits, tu auras besoin des deux.','Mirar lejos y mirar cerca. En este pozo vas a necesitar las dos.')}]},
  {id:'d5',q:tf('√2 existe-t-il, si on ne peut jamais l’écrire en entier ?','¿Existe √2, si nunca se puede escribir entero?'),opts:[
    {t:tf('Oui : c’est la diagonale, je peux la tracer avec une règle.','Sí: es la diagonal, la puedo dibujar con una regla.'),r:L_('hipaso','happy','C’est ce que je pense ! Elle est là, la diagonale, parfaitement réelle. Ce qui n’existe pas, c’est une fraction qui la mesure.','¡Eso pienso yo! Ahí está la diagonal, perfectamente real. Lo que no existe es una fracción que la mida.')},
    {t:tf('Non : si on ne peut pas l’écrire, ce n’est pas un nombre.','No: si no se puede escribir, no es un número.'),r:L_('teano','neutral','Beaucoup de Grecs pensaient comme toi. Aujourd’hui, on dit qu’il existe et on l’appelle un nombre irrationnel : impossible à écrire en fraction, mais bien réel.','Muchos griegos pensaban así. Hoy decimos que existe y lo llamamos número irracional: no se puede escribir como fracción, pero existe.')},
    {t:tf('Il existe, mais c’est un nombre d’un autre genre.','Existe, pero es un número de otro tipo.'),r:L_('hipaso','happy','Exactement ! Un nombre nouveau, qui n’est pas une fraction. Aujourd’hui, on les appelle les irrationnels.','¡Exacto! Un número nuevo, que no es una fracción. Hoy los llamamos irracionales.')}]},
  {id:'d6',q:tf('Tu découvres une chose qui contredit ce que croit ton école. Que fais-tu ?','Descubres algo que contradice lo que cree tu escuela. ¿Qué haces?'),opts:[
    {t:tf('Je le dis : la vérité, c’est la vérité.','Lo cuento: la verdad es la verdad.'),r:L_('hipaso','worried','La légende dit que je l’ai raconté hors de l’école… et que j’ai disparu dans un naufrage. Ce n’est sûrement qu’une légende.','La leyenda dice que lo conté fuera de la escuela… y que desaparecí en un naufragio. Seguramente es solo una leyenda.')},
    {t:tf('Je le garde secret pour ne pas causer de problèmes.','Lo guardo en secreto para no causar problemas.'),r:L_('teano','worried','Les pythagoriciens étaient très discrets. Mais un secret pareil ne se garde pas pour toujours : la vérité finit par sortir.','Los pitagóricos eran muy reservados. Pero un secreto así no se puede guardar para siempre: la verdad acaba saliendo.')},
    {t:tf('Je vérifie encore une fois, puis je le dis.','Lo compruebo otra vez y luego lo cuento.'),r:L_('teano','happy','Très scientifique : vérifier, puis partager. Si la démonstration est bonne, personne ne pourra la nier.','Muy científico: revisar y luego compartir. Si la demostración es buena, nadie podrá negarla.')}]},
  {id:'d7',q:tf('Tous les carrés sont des rectangles. Donc, tous les rectangles sont des carrés ?','Todos los cuadrados son rectángulos. Entonces, ¿todos los rectángulos son cuadrados?'),best:1,opts:[
    {t:tf('Oui, c’est la même phrase à l’envers.','Sí, es lo mismo dicho al revés.'),r:L_('aristoteles','neutral','Attention : retourner une phrase change son sens. Une feuille de papier est un rectangle, mais pas un carré.','Cuidado: dar la vuelta a una frase cambia su significado. Un folio es un rectángulo, pero no es un cuadrado.')},
    {t:tf('Non : un rectangle peut avoir des côtés différents.','No: un rectángulo puede tener lados distintos.'),r:L_('aristoteles','happy','Bien raisonné ! « Si A, alors B » ne veut pas dire « si B, alors A ». Cette phrase retournée s’appelle la réciproque.','¡Bien razonado! «Si A, entonces B» no significa «si B, entonces A». Esa frase al revés se llama el recíproco.')},
    {t:tf('Ça dépend du rectangle.','Depende del rectángulo.'),r:L_('aristoteles','neutral','Presque : certains rectangles sont des carrés, mais pas tous. Donc la phrase générale est fausse.','Casi: algunos rectángulos son cuadrados, pero no todos. Así que la frase general es falsa.')}]},
  {id:'d8',q:tf('Qu’est-ce que démontrer ?','¿Qué es demostrar?'),best:1,opts:[
    {t:tf('Montrer beaucoup d’exemples qui marchent.','Enseñar muchos ejemplos que funcionan.'),r:L_('socrates','neutral','Et si demain on en trouve un qui ne marche pas ? Alors tu ne le savais pas : tu le croyais seulement.','¿Y si mañana aparece uno que no funciona? Entonces no lo sabías: solo lo creías.')},
    {t:tf('Raisonner étape par étape à partir de ce qu’on sait déjà, sans exception.','Razonar paso a paso desde lo que ya sabemos, sin excepciones.'),r:L_('socrates','happy','Alors personne ne pourra t’enlever cette vérité, pas même moi avec mes questions.','Entonces nadie podrá quitarte esa verdad, ni siquiera yo con mis preguntas.')},
    {t:tf('Que quelqu’un de très savant le dise.','Que lo diga alguien que sabe mucho.'),r:L_('socrates','neutral','Et qui vérifie celui qui sait beaucoup ? Moi, je sais seulement que je ne sais rien… c’est pour ça que je pose des questions.','¿Y quién comprueba al que sabe mucho? Yo solo sé que no sé nada… por eso pregunto.')}]},
  {id:'d9',q:tf('Peut-on mesurer ce qu’on ne peut pas toucher ?','¿Se puede medir algo que no se puede tocar?'),best:1,opts:[
    {t:tf('Non : pour mesurer, il faut aller jusque là-bas.','No: para medir hay que llegar hasta allí.'),r:L_('hiparco','neutral','Alors on ne connaîtrait jamais la taille de la Terre… et Ératosthène l’a mesurée avec l’ombre d’un bâton.','Entonces nunca sabríamos el tamaño de la Tierra… y Eratóstenes la midió con la sombra de un palo.')},
    {t:tf('Oui : avec des angles et des triangles.','Sí: con ángulos y triángulos.'),r:L_('hiparco','happy','C’est ça, la trigonométrie ! Si tu connais un angle et un côté, le triangle t’offre tout le reste.','¡Eso es la trigonometría! Si conoces un ángulo y un lado, el triángulo te regala los demás.')},
    {t:tf('Seulement en devinant.','Solo adivinando.'),r:L_('teano','neutral','Deviner ne suffit pas pour un astronome. Avec des angles, on peut vraiment calculer.','Adivinar no basta para un astrónomo. Con ángulos se puede calcular de verdad.')}]},
  {id:'d10',q:tf('Comment dirais-tu exactement où est la mouche ?','¿Cómo dirías exactamente dónde está la mosca?'),best:0,opts:[
    {t:tf('Avec deux nombres : sa distance à deux murs.','Con dos números: su distancia a dos paredes.'),r:L_('descartes','happy','Voilà ! Deux nombres, ses coordonnées, et n’importe quel point est repéré. La géométrie devient des nombres.','¡Voilà! Dos números, sus coordenadas, y cualquier punto queda localizado. Así la geometría se convierte en números.')},
    {t:tf('En la montrant du doigt.','Señalándola con el dedo.'),r:L_('descartes','neutral','Et si je te le demande par lettre ? Il nous faut quelque chose qu’on peut écrire : des nombres.','¿Y si te lo pregunto por carta? Necesitamos algo que se pueda escribir: números.')},
    {t:tf('En disant « près de la lampe ».','Diciendo «cerca de la lámpara».'),r:L_('descartes','neutral','Trop vague pour un mathématicien. Mieux : « à 2 mètres de ce mur et à 3 mètres de celui-là ».','Demasiado vago para un matemático. Mejor: «a 2 metros de esta pared y a 3 de aquella».')}]},
  {id:'d11',q:tf('Est-il juste d’interdire l’entrée à ceux qui ne savent pas la géométrie ?','¿Es justo prohibir la entrada a quien no sabe geometría?'),opts:[
    {t:tf('Oui : il faut arriver préparé.','Sí: hay que llegar preparado.'),r:L_('platon','neutral','Pour moi, la géométrie était la porte de la pensée : elle apprend à raisonner sur ce qu’on ne voit pas.','Para mí, la geometría era la puerta del pensamiento: enseña a razonar sobre lo que no se ve.')},
    {t:tf('Non : l’école, c’est fait pour apprendre.','No: la escuela está para aprender.'),r:L_('teano','happy','Beaucoup pensent comme toi : aujourd’hui l’école est pour tout le monde, et la géométrie s’apprend à l’intérieur.','Muchos opinan como tú: hoy la escuela es para todos, y la geometría se aprende dentro.')},
    {t:tf('Oui, si on t’a appris avant ailleurs.','Sí, si antes te enseñan en otro sitio.'),r:L_('platon','neutral','Un juste milieu. Peut-être la phrase voulait-elle dire : ici, on vient pour penser sérieusement.','Un término medio. Quizá la frase quería decir: aquí se viene a pensar en serio.')}]},
  {id:'d12',q:tf('Maintenant tu connais le secret du temple. Qu’en feras-tu ?','Ahora conoces el secreto del templo. ¿Qué harás con él?'),opts:[
    {t:tf('Le garder secret, comme les pythagoriciens.','Guardarlo en secreto, como los pitagóricos.'),r:L_('hipatia','neutral','Un secret gardé meurt avec celui qui le garde. Si les copistes n’avaient pas partagé les livres, on ne saurait rien de Pythagore.','Un secreto guardado muere con quien lo guarda. Si los copistas no hubieran compartido los libros, hoy no sabríamos nada de Pitágoras.')},
    {t:tf('Le partager et l’expliquer aux autres.','Compartirlo y enseñarlo.'),r:L_('hipatia','happy','C’est la meilleure façon de faire survivre le savoir : l’expliquer aux autres. Apprendre en enseignant, c’est apprendre deux fois.','Esa es la mejor forma de que el saber sobreviva: explicarlo a otros. Aprender enseñando es aprender dos veces.')},
    {t:tf('M’en servir pour construire des choses.','Usarlo para construir cosas.'),r:L_('teano','happy','Des ponts, des écrans, des cartes, des satellites… Le théorème travaille encore tous les jours.','Puentes, pantallas, mapas, satélites… El teorema sigue trabajando cada día.')}]},

const SCENES={
  prologue:{bg:'samos',cast:['teano','pitagoras'],lines:[
    L_('nar','','Samos, une île grecque, il y a environ 2 500 ans.','Samos, isla griega, hace unos 2.500 años.'),
    L_('teano','happy','Te voilà enfin, {N} ! Je suis Théano. J’étudie dans l’école de Pythagore, à Crotone. Je serai ta guide dans le temple.','¡Por fin llegas, {N}! Soy Teano. Estudio en la escuela de Pitágoras, en Crotona. Seré tu guía en el templo.'),
    L_('pitagoras','neutral','Bienvenue. Dans mon école, nous croyons que tout est nombre : la musique, les étoiles, les formes…','Bienvenido. En mi escuela creemos que todo es número: la música, las estrellas, las formas…'),
    L_('pitagoras','neutral','Dans ce temple, nous avons caché notre plus grand secret : une règle que respectent tous les triangles rectangles.','Dentro de este templo escondimos nuestro mayor secreto: una regla que cumplen todos los triángulos rectángulos.'),
    L_('teano','neutral','Avant d’entrer, le maître pose toujours une question. Réfléchis bien : il n’y a pas de réponse bête.','Antes de entrar, el maestro siempre hace una pregunta. Piénsalo bien: no hay respuesta tonta.'),
    {dil:'d1'},
    L_('teano','happy','De toute façon, le temple ne s’ouvre qu’à ceux qui découvrent le secret de leurs propres yeux. Commence par la Salle des Carrés.','Sea como sea, el templo solo se abre a quien descubre el secreto con sus propios ojos. Empieza por la Cámara de los Cuadrados.'),
    L_('pitagoras','happy','Et souviens-toi : ne crois rien parce que c’est moi qui le dis. Vérifie-le.','Y recuerda: no te creas nada porque lo diga yo. Compruébalo.')]},
  c1:{bg:'tiles',cast:['teano','pitagoras'],lines:[
    L_('teano','neutral','Regarde le sol : sur chaque côté du triangle, quelqu’un a construit un carré de carreaux.','Mira el suelo: sobre cada lado del triángulo alguien construyó un cuadrado de baldosas.'),

    L_('teano','worried','Mais attention : un exemple peut tromper. Comment saurons-nous si le secret marche toujours ?','Pero cuidado: un ejemplo puede engañar. ¿Cómo sabremos si el secreto vale siempre?'),
    {dil:'d2'},
    L_('teano','happy','D’abord, compte. Ensuite, au laboratoire, essaie autant de triangles que tu veux.','Primero, cuenta. Después, en el laboratorio, prueba todos los triángulos que quieras.')]},
  c2:{bg:'nile',cast:['teano','arpedonapta'],lines:[
    L_('nar','','Égypte. Chaque année, le Nil déborde et efface les limites des champs.','Egipto. Cada año, el Nilo se desborda y borra los límites de los campos.'),
    L_('arpedonapta','neutral','Je suis arpenteur. Quand l’eau redescend, nous tendons des cordes pour mesurer à nouveau les terres de chaque famille.','Soy agrimensor. Cuando baja el agua, tensamos cuerdas para volver a medir las tierras de cada familia.'),
    L_('arpedonapta','happy','Avec une corde à 12 nœuds, je fais un triangle de 3, 4 et 5 morceaux. Et le coin sort droit !','Con una cuerda de 12 nudos hago un triángulo de 3, 4 y 5 tramos. ¡Y la esquina sale recta!'),
    L_('teano','neutral','On raconte qu’ils faisaient comme ça, même si on n’en a pas de preuve sûre. Ce qui est sûr, c’est que ça marche.','Se cuenta que lo hacían así, aunque no hay pruebas seguras. Lo que sí sabemos es que funciona.'),
    {dil:'d3'},
    L_('arpedonapta','neutral','À toi : il y a des gouffres à traverser. Calcule chaque corde avant que la torche s’éteigne.','Ahora tú: hay abismos que cruzar. Calcula cada cuerda antes de que se apague la antorcha.')]},
  c3:{bg:'well',cast:['teano','tales'],lines:[
    L_('tales','wow','Aïe ! Aide-moi à sortir. Je marchais en regardant les étoiles et… je suis tombé dans le puits.','¡Ay! Ayúdame a salir. Iba mirando las estrellas y… me he caído al pozo.'),
    L_('teano','neutral','C’est Thalès de Milet, le premier grand sage grec. C’est Platon qui raconte l’anecdote : une servante s’est moquée de lui.','Es Tales de Mileto, el primer gran sabio griego. La anécdota la cuenta Platón: una sirvienta se rio de él.'),
    L_('tales','sad','Elle a ri parce que je voulais connaître le ciel et que je ne voyais pas ce qu’il y avait à mes pieds.','Se rio porque quería conocer el cielo y no veía lo que tenía a los pies.'),
    {dil:'d4'},
    L_('tales','neutral','Pour descendre, il te faut des échelles de la bonne longueur. Attention : cette fois, l’échelle est l’hypoténuse.','Para bajar necesitas escaleras de la medida justa. Cuidado: ahora la escalera es la hipotenusa.')]},
  c7:{bg:'fountain',cast:['teano','hipaso'],lines:[
    L_('hipaso','worried','Théano… Qui est-ce ? Tu es venue me surveiller ?','Teano… ¿Quién es? ¿Has venido a vigilarme?'),
    L_('teano','neutral','Calme-toi, Hippase. Ce visiteur vient apprendre. Raconte-lui ce que tu as découvert.','Tranquilo, Hipaso. Viene a aprender. Cuéntale lo que descubriste.'),
    L_('hipaso','neutral','Nous, les pythagoriciens, croyons que toute mesure peut s’écrire comme une fraction de nombres entiers : 3/2, 7/5…','Los pitagóricos creemos que toda medida se puede escribir como una fracción de números enteros: 3/2, 7/5…'),
    L_('hipaso','neutral','Mais j’ai calculé la diagonale d’un carré de côté 1 avec le théorème : d² = 1 + 1 = 2. Donc d = √2.','Pero calculé la diagonal de un cuadrado de lado 1 con el teorema: d² = 1 + 1 = 2. Así que d = √2.'),
    L_('hipaso','wow','Et √2 n’est aucune fraction. Je l’ai démontré. Ses décimales continuent pour toujours sans se répéter : 1,41421356…','Y √2 no es ninguna fracción. Lo demostré. Sus decimales siguen para siempre sin repetirse: 1,41421356…'),
    {dil:'d5'},{dil:'d6'},
    L_('teano','neutral','La fontaine ne donne de l’eau qu’à ceux qui comprennent les racines. Vas-y.','La fuente solo da agua a quien entiende las raíces. Adelante.')]},
  c4:{bg:'library',cast:['teano','aristoteles'],lines:[
    L_('aristoteles','neutral','Bienvenue à la bibliothèque. Je suis Aristote. J’ai écrit les règles de la logique : comment raisonner sans se tromper.','Bienvenido a la biblioteca. Soy Aristóteles. Escribí las reglas de la lógica: cómo razonar sin equivocarse.'),
    L_('aristoteles','angry','Le scribe qui a écrit ces parchemins ne les respectait pas : il a mélangé des données inutiles et des unités différentes.','El escriba que escribió estos pergaminos no las respetaba: mezcló datos inútiles y unidades distintas.'),
    L_('aristoteles','neutral','Avant d’entrer, une petite épreuve de logique.','Antes de entrar, una prueba de lógica.'),
    {dil:'d7'},
    L_('teano','neutral','Retiens-le : la réciproque n’est pas toujours vraie. Pour Pythagore, si… mais il faudra le démontrer plus tard.','Recuérdalo: el recíproco no siempre es verdad. Con el de Pitágoras, sí… pero habrá que demostrarlo más adelante.'),
    L_('aristoteles','neutral','Maintenant, aux parchemins : avant de calculer, repère ce qu’est chaque donnée.','Ahora, a los pergaminos: antes de calcular, marca qué es cada dato.')]},
  c8:{bg:'tribunal',cast:['teano','socrates','euclides'],lines:[
    L_('nar','','Athènes. Sur la place, un homme pieds nus pose des questions à tout le monde.','Atenas. En la plaza, un hombre descalzo hace preguntas a todo el mundo.'),
    L_('socrates','neutral','Alors c’est toi, le nouvel explorateur, {N} ? On m’a dit que tu sais que ce triangle est rectangle. Comment le sais-tu ?','¿Así que tú eres el nuevo explorador, {N}? Me han dicho que sabes que este triángulo es rectángulo. ¿Cómo lo sabes?'),
    L_('teano','neutral','Socrate ne donne jamais de réponses. Il pose des questions… jusqu’à ce que tu découvres toi-même ce que tu penses.','Sócrates nunca da respuestas. Solo pregunta… hasta que descubres tú mismo lo que piensas.'),
    {dil:'d8'},
    L_('euclides','neutral','Socrate a raison. Dans mes Éléments, juste après le théorème, j’ai démontré sa réciproque.','Sócrates tiene razón. En mis Elementos, justo después del teorema, demostré su recíproco.'),
    L_('euclides','neutral','Si le carré du plus grand côté est égal à la somme des carrés des deux autres, le triangle est rectangle. Et sinon, il ne l’est pas : c’est la contraposée.','Si el cuadrado del lado mayor es igual a la suma de los cuadrados de los otros dos, el triángulo es rectángulo. Y si no coinciden, no lo es: es el contrarrecíproco.'),
    L_('teano','happy','Dans ce tribunal, chaque triangle accusé mérite une démonstration. Rédige avec soin.','En este tribunal, cada triángulo acusado merece una demostración. Redacta con cuidado.')]},
  c9:{bg:'observatory',cast:['teano','hiparco'],lines:[
    L_('hiparco','neutral','Regarde le ciel. Je suis Hipparque. Depuis l’île de Rhodes, j’ai mesuré les étoiles : j’en ai fait un catalogue de plusieurs centaines.','Mira el cielo. Soy Hiparco. Desde la isla de Rodas medí las estrellas: hice un catálogo con cientos de ellas.'),
    L_('hiparco','worried','Je voulais savoir à quelle distance est la Lune. Mais on ne peut pas y aller avec une corde !','Quería saber a qué distancia está la Luna. ¡Pero no se puede llegar con una cuerda!'),
    {dil:'d9'},
    L_('hiparco','neutral','J’ai fait une table qui relie les angles aux cordes d’un cercle. Des siècles plus tard, en Inde, Aryabhata a utilisé des demi-cordes : le sinus.','Hice una tabla que relacionaba ángulos y cuerdas de un círculo. Siglos después, en la India, Aryabhata usó medias cuerdas: el seno.'),
    L_('teano','neutral','Ici, tu utiliseras le cosinus : le côté adjacent divisé par l’hypoténuse. Attention, calculatrice en degrés.','Aquí usarás el coseno: el cateto contiguo dividido entre la hipotenusa. Ojo, la calculadora en grados.')]},
  c10:{bg:'crypt',cast:['teano','descartes'],lines:[
    L_('nar','','Un saut dans le temps : la France, au XVIIe siècle.','Un salto en el tiempo: Francia, siglo XVII.'),
    L_('descartes','neutral','Bonjour. Je suis René Descartes. On raconte qu’un matin, au lit, je regardais une mouche se promener au plafond…','Bonjour. Soy René Descartes. Se cuenta que una mañana, en la cama, miraba una mosca que paseaba por el techo…'),
    {dil:'d10'},
    L_('descartes','neutral','Et avec des coordonnées, la distance entre deux points se calcule avec… devine ? Pythagore.','Y con coordenadas, la distancia entre dos puntos se calcula con… ¿adivinas? Pitágoras.'),
    L_('descartes','wow','Et si la mouche s’envole ? Il faut un troisième nombre : la hauteur. Bienvenue dans l’espace.','¿Y si la mosca echa a volar? Hace falta un tercer número: la altura. Bienvenido al espacio.'),
    L_('teano','neutral','Retiens sa phrase la plus célèbre : « Je pense, donc je suis. » Il doutait de tout pour trouver quelque chose de sûr.','Recuerda su frase más famosa: «Pienso, luego existo». Dudaba de todo para encontrar algo seguro.')]},
  c5:{bg:'sealed',cast:['teano','platon'],lines:[
    L_('platon','neutral','Je suis Platon. À l’entrée de mon école, l’Académie, on dit qu’il était écrit : « Que nul n’entre ici s’il n’est géomètre. »','Soy Platón. En la entrada de mi escuela, la Academia, se dice que había un aviso: «Que no entre nadie que no sepa geometría».'),
    {dil:'d11'},
    L_('platon','neutral','Cette salle s’est scellée. Tu ne sortiras qu’en utilisant tout ce que tu as appris.','Esta cámara se ha sellado. Solo saldrás si usas todo lo que has aprendido.')]},
  c6:{bg:'hall',cast:['teano','guardian'],lines:[
    L_('guardian','angry','QUI RÉVEILLE LE GARDIEN ?','¿QUIÉN DESPIERTA AL GUARDIÁN?'),
    L_('teano','worried','Mon élève vient avec moi, Gardien. Il a parcouru tout le temple.','Viene conmigo, Guardián. Ha recorrido todo el templo.'),
    L_('guardian','neutral','Beaucoup de sages ont connu mon secret sous des noms différents. En Chine, on l’appelait gougu. Prouve que tu le maîtrises en entier.','Muchos sabios conocieron mi secreto con nombres distintos. En China lo llamaban gougu. Demuestra que lo dominas entero.'),
    L_('teano','happy','Hypoténuses, racines, réciproques, cosinus, distances… Tu peux le faire, {N} !','Hipotenusas, raíces, recíprocos, cosenos, distancias… ¡Tú puedes, {N}!')]},
  o_c1:{bg:'library',cast:['teano','euclides'],lines:[
    L_('euclides','neutral','Salut. Je suis Euclide, d’Alexandrie. J’ai vécu environ 200 ans après Pythagore.','Saludos. Soy Euclides, de Alejandría. Viví unos 200 años después de Pitágoras.'),
    L_('euclides','happy','Ce que tu as vu avec des carreaux, je l’ai démontré dans mon livre, les Éléments : c’est la proposition 47 du premier livre.','Lo que has visto con baldosas, yo lo demostré en mi libro, los Elementos: es la proposición 47 del primer libro.'),
    L_('euclides','neutral','Je n’ai pas utilisé d’exemples. Je suis parti de quelques vérités évidentes et j’ai raisonné étape par étape. Ainsi, le théorème vaut pour tous les triangles rectangles.','No usé ejemplos. Partí de unas pocas verdades evidentes y fui razonando paso a paso. Así, el teorema vale para todos los triángulos rectángulos.'),
    L_('teano','happy','Retiens bien son nom. Tu le reverras au Tribunal des Triangles.','Guarda bien su nombre. Volverás a verlo en el Tribunal de los Triángulos.')]},
  o_c7:{bg:'fountain',cast:['teano','hipaso'],lines:[
    L_('hipaso','happy','Tu as compris les racines ! Maintenant tu sais pourquoi √2 m’a tant fait trembler.','¡Has entendido las raíces! Ahora sabes por qué √2 me hizo temblar tanto.'),
    L_('teano','neutral','Les pythagoriciens ont dû accepter qu’il existe des longueurs qu’aucune fraction ne mesure. Les mathématiques ont grandi grâce à cette surprise.','Los pitagóricos tuvieron que aceptar que hay longitudes que ninguna fracción mide. Las matemáticas crecieron gracias a esa sorpresa.')]},
  o_c6:{bg:'hall',cast:['teano','guardian','hipatia','pitagoras'],lines:[
    L_('guardian','happy','Tu as vaincu. Le temple est à toi.','Has vencido. El templo es tuyo.'),
    {bg:'alexandria'},
    L_('nar','','Alexandrie, vers l’an 400. La ville de la grande Bibliothèque.','Alejandría, hacia el año 400. La ciudad de la gran Biblioteca.'),
    L_('hipatia','neutral','Bonjour. Je suis Hypatie. J’enseigne les mathématiques et la philosophie, comme mon père, Théon.','Hola. Soy Hipatia. Enseño matemáticas y filosofía, como mi padre, Teón.'),
    L_('hipatia','neutral','Théon a préparé une édition des Éléments d’Euclide qu’on a recopiée à la main pendant des siècles. C’est comme ça que le théorème est arrivé jusqu’à toi.','Teón preparó una edición de los Elementos de Euclides que se copió a mano durante siglos. Así llegó el teorema hasta ti.'),
    {dil:'d12'},
    L_('teano','happy','Merci de m’avoir accompagnée, {N}. Le temple restera ici : reviens quand tu veux chercher plus d’étoiles.','Gracias por acompañarme, {N}. El templo seguirá aquí: vuelve cuando quieras a por más estrellas.'),
    L_('pitagoras','happy','Et souviens-toi : ne crois rien parce que c’est moi qui le dis. Vérifie-le… et démontre-le !','Y recuerda: no te creas nada porque lo diga yo. Compruébalo… ¡y demuéstralo!')]},
};

  return new Promise(res=>{TALK.on=true;hush();if(R)R.paused=true;const prevMus=AU.cur&&AU.cur.name;musicPlay('talk');
    const box=$('#talk');box.hidden=false;box.innerHTML=`<div class="tk-scene" id="tkScene">${sceneBG(sc.bg)}</div><div class="tk-cast"><div class="tk-p left" id="tkL"></div><div class="tk-p right" id="tkR"></div></div>

    const fitCast=()=>{const b=$('#tkBox');if(b)box.style.setProperty('--tkb',(b.offsetHeight+26)+'px');};fitCast();let ro=null;try{ro=new ResizeObserver(fitCast);ro.observe($('#tkBox'));}catch(e){}
    const queue=sc.lines.slice();let typing=false,full='',timer=null,ended=false,waitChoice=false;
    const setP=(slot,who,mood)=>{const el=$(slot==='left'?'#tkL':'#tkR');const key=who+':'+mood;if(el.dataset.k===key)return;const isNew=el.dataset.who!==who;el.dataset.k=key;el.dataset.who=who;el.innerHTML=who?portrait(who,mood):'';if(isNew&&who){el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter');}};
    const show=(Ln)=>{const who=Ln.w||'nar',c=CAST[who]||CAST.nar;const side=who==='nar'?null:who==='teano'?'left':'right';

      $('#tkName').innerHTML=who==='nar'?'':`<b style="color:${c.col}">${esc(T(c.n))}</b><span>${esc(T(c.role))}</span>`;$('#tkName').hidden=who==='nar';$('#tkBox').classList.toggle('nar',who==='nar');
      const raw=T(Ln.t);full=withName(raw);const el=$('#tkText');el.innerHTML='';typing=true;$('#tkBox').classList.remove('ready');let k=0;const pt=plain(full);

      const tick=()=>{if(!typing)return;k+=reduced()?9999:2;if(k%6===0)sfx('type');if(k>=pt.length){typing=false;el.innerHTML=full;$('#tkBox').classList.add('ready');return;}el.textContent=pt.slice(0,k);timer=setTimeout(tick,16);};tick();};
    function step(){if(ended||waitChoice)return;if(!queue.length)return finish();const Ln=queue.shift();

      if(c.nodeType===3){const frag=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){frag.appendChild(document.createTextNode(' '));return;}const ws=document.createElement('span');ws.className='rw';ws.setAttribute('aria-hidden','true');Array.from(w).forEach(ch=>{const l=document.createElement('span');l.className='rl';l.textContent=ch;l.style.animationDelay=(base+i++*0.032).toFixed(3)+'s';ws.appendChild(l);});frag.appendChild(ws);});c.replaceWith(frag);}

document.addEventListener('keydown',e=>{
  if(TALK.on)return;
  const modal=$('#modal'),tg=e.target;
  if(e.key==='Escape'){if(!modal.hidden){closeModal(true);return;}if(!$('#calc').hidden){toggleCalc(false);return;}}
  if(tg.id==='calcIn'&&e.key==='Enter'){e.preventDefault();calcKey('=');return;}
  if(!modal.hidden||e.repeat)return;
  const inField=tg.matches&&tg.matches('input,textarea,select');
  if(inField)return;
  if((e.key==='Enter'||e.key===' ')&&tg.matches&&tg.matches('[data-act]:not(button)')){e.preventDefault();tg.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
  if(e.key==='Enter'){if(tg.closest&&tg.closest('button'))return;const b=$('#view [data-act="next"], #view [data-act="retry"]');if(b){e.preventDefault();b.click();}return;}
  if(view==='play'&&R&&R.q&&!R.q.done&&/^[1-4]$/.test(e.key)){const i=+e.key-1;if(R.q.kind==='choice'&&i<R.q.choices.length)answer(i);else if(R.q.kind==='proof'){const b=$(`.pf-opts .pf-o[data-i="${i}"]`);if(b&&!b.disabled)proofPick(i);}}
});

/* ---------- arranque ---------- */
if(!Array.isArray(S.revealed)){S.revealed=ORDER.filter((id,i)=>isUnlocked(i));save();}
if(S.prologue){['pitagoras','teano'].forEach(k=>{if(!S.sages[k])S.sages[k]={q:false};});}
ORDER.forEach(id=>{if((S.stars[id]||0)>=1)SAGES.forEach(x=>{if(x.at===id&&!S.sages[x.id])S.sages[x.id]={q:false};});});
applyLang();loadRec();
makeGrain();requestAnimationFrame(parLoop);
go('title');

/* =========================================================
   LISTA DE FRASES GRABABLES (para tools/voces-lista.js)
   Cada frase fija del juego con su personaje; las que llevan números se leen con la voz del aparato.
   ========================================================= */
function voiceLines(){const out=[],seen=new Set();const add=(tx,who)=>{const p=plain(String(tx||''));if(!p||!/[\p{L}]/u.test(p))return;who=who||'nar';const k=voKey(p,who);if(seen.has(k))return;seen.add(k);out.push({who,text:p,key:k,say:speakable(p)});};
  Object.values(SCENES).forEach(sc=>sc.lines.forEach(x=>{if(x.t)add(dropName(T(x.t)),x.w);}));
  DILEMMAS.forEach(d=>{add(T(d.q),'teano');d.opts.forEach(o=>add(dropName(T(o.r.t)),o.r.w));});
  Object.values(INTROS).forEach(I=>add(T(I.story)+(I.echo?' '+T(I.echo):''),'nar'));
  const LL=[];const walk=v=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'&&(v.fr!=null||v.es!=null))LL.push(T(v));else if(v&&typeof v==='object')Object.values(v).forEach(walk);};walk(LINES);LL.forEach(x=>add(x));
  SAGES.forEach(x=>{add(sageSpeech(x,false));add(sageSpeech(x,true));});
  ORDER.forEach((id,i)=>{add(cardSay(id,i));add(t('La brume se dissipe. ','La niebla se disipa. ')+T(CH[id].name)+'.');add(chName(id)+'. '+T(CH[id].desc));add(chName(id)+'. '+t('Fermée.','Cerrada.'));});
  ['daily','train','survival','exam'].forEach(id=>add(cardSay(id,-1)));
  RANKS.forEach((r,i)=>add(t('Nouveau rang : ','Nuevo rango: ')+rankName(i)+'.'));
  const P0=PROLOGUE();add(plain(P0.replace(/<br>/g,' ')));
  [t('La brume se dissipe. De nouvelles salles sont révélées.','La niebla se disipa. Se han revelado nuevas cámaras.'),t('Une salle cachée dans la brume.','Una cámara oculta en la niebla.'),
   t('Dans le Codex des Sages, tu as déjà les premières pages : l’histoire de Pythagore et de Théano. Commence par la Salle des Carrés.','En el Códice de los Sabios ya tienes las primeras páginas: la historia de Pitágoras y de Teano. Empieza por la Cámara de los Cuadrados.'),
   t('Bon retour. Choisis ta prochaine salle.','Bienvenido de nuevo. Elige tu próxima cámara.'),t('Bienvenue. Commence par la Salle des Carrés.','Bienvenido. Empieza por la Cámara de los Cuadrados.'),
   t('Laboratoire du temple. Change les côtés et vérifie si le secret marche toujours.','Laboratorio del templo. Mueve los catetos y comprueba si el secreto funciona siempre.'),
   t('Tu as découvert le sceau de Pythagore. Dans un triangle rectangle, le carré de l’hypoténuse est égal à la somme des carrés des deux autres côtés.','Has descubierto el sello de Pitágoras. En todo triángulo rectángulo, el cuadrado de la hipotenusa es igual a la suma de los cuadrados de los catetos.'),
   t('Œil de faucon. Données parfaites. Maintenant, calcule.','Ojo de halcón. Datos perfectos. Ahora calcula.'),t('Données prêtes. Maintenant, calcule.','Datos listos. Ahora calcula.'),
   t('Ce n’est pas ça. Relis l’histoire.','No es esa. Vuelve a leer la historia.'),t('Expédition terminée. La réalité confirme Pythagore.','Expedición completada. La realidad confirma a Pitágoras.'),
   t('Salle réussie','Cámara superada'),t('Plus d’amulettes','Sin amuletos'),t('La torche s’est éteinte','Se apagó la antorcha'),t('Tu t’es échappé !','¡Has escapado!'),t('Le sable est écoulé','Se acabó la arena'),t('Tu as vaincu le Gardien !','¡Has vencido al Guardián!'),t('Le Gardien résiste','El Guardián resiste'),t('Contrôle corrigé','Examen corregido'),t('Nouveau record !','¡Nuevo récord!'),t('Fin de l’escalier','Fin de la escalera'),t('Entraînement terminé','Entrenamiento terminado'),t('Défi terminé','Desafío completado'),
   t('Tu n’as plus d’amulettes. Ce que tu as appris reste avec toi : réessaie.','Te has quedado sin amuletos. Lo que has aprendido sigue contigo: vuelve a intentarlo.'),t('La porte reste scellée. Chaque essai te rapproche : les serrures changent à chaque fois.','La puerta sigue sellada. Cada intento te deja más cerca: las cerraduras cambian cada vez.'),
  ].forEach(x=>add(x));
  return out;}

})();
